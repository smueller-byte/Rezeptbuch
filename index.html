/* ------------------------- PDF einlesen --------------------------------- */
/* Liest den Text direkt aus der PDF-Datei. Funktioniert bei PDFs mit echtem
   Text (aus Word, aus dem Netz, aus Kochbuch-Apps). Eingescannte Seiten sind
   nur Bilder – da findet die App keinen Text und sagt das auch. */

async function inflate(bytes){
  if(typeof DecompressionStream === 'undefined') return null;
  for(const fmt of ['deflate','deflate-raw']){
    try{
      const ds = new DecompressionStream(fmt);
      const st = new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(st).arrayBuffer());
    }catch(e){ /* nächstes Format versuchen */ }
  }
  return null;
}
const bytesToLatin = b => { let s=''; const N=8192;
  for(let i=0;i<b.length;i+=N) s += String.fromCharCode.apply(null, b.subarray(i,i+N));
  return s; };

function readLiteral(s, i){          /* ( … ) inklusive Escapes */
  let out='', depth=0; i++;
  while(i < s.length){
    const c = s[i];
    if(c === '\\'){
      const nx = s[i+1];
      const oct = /^[0-7]{1,3}/.exec(s.slice(i+1,i+4));
      if(oct){ out += String.fromCharCode(parseInt(oct[0],8)); i += 1+oct[0].length; continue; }
      out += ({'n':'\n','r':'\r','t':'\t','b':'','f':''}[nx] !== undefined
              ? ({'n':'\n','r':'\r','t':'\t','b':'','f':''}[nx]) : nx);
      i += 2; continue;
    }
    if(c === '('){ depth++; out += c; i++; continue; }
    if(c === ')'){ if(!depth) return [out, i+1]; depth--; out += c; i++; continue; }
    out += c; i++;
  }
  return [out, i];
}
/* Zielwerte einer CMap sind immer UTF-16BE */
function hexToUnicode(h){
  const c = h.replace(/\s+/g,'');
  if(c.length % 4 === 0){
    let out='';
    for(let i=0;i<c.length;i+=4) out += String.fromCharCode(parseInt(c.substr(i,4),16));
    return out;
  }
  return hexString(c);
}
function hexString(h){
  const clean = h.replace(/\s+/g,'');
  if(/^FEFF/i.test(clean)){          /* UTF-16BE */
    let out='';
    for(let i=4;i+3<clean.length+1;i+=4) out += String.fromCharCode(parseInt(clean.substr(i,4),16));
    return out;
  }
  let out='';
  for(let i=0;i+1<clean.length+1;i+=2) out += String.fromCharCode(parseInt(clean.substr(i,2),16));
  return out;
}
/* Viele PDFs benutzen eingebettete Teil-Schriften mit eigenen Zeichencodes.
   Die Übersetzungstabelle dazu steht als CMap im Dokument (beginbfchar /
   beginbfrange). Ohne sie käme nur Buchstabensalat heraus. */
function parseCMap(c, map){
  let m, re;
  re = /beginbfchar([\s\S]*?)endbfchar/g;
  while((m = re.exec(c))){
    const rr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g; let x;
    while((x = rr.exec(m[1]))){
      if(x[1].length >= 4) map.__two = true;
      map[parseInt(x[1],16)] = hexToUnicode(x[2]);
    }
  }
  re = /beginbfrange([\s\S]*?)endbfrange/g;
  while((m = re.exec(re.lastIndex!==undefined?c:c))){
    const body = m[1];
    const rr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(<([0-9A-Fa-f]+)>|\[([\s\S]*?)\])/g;
    let x;
    while((x = rr.exec(body))){
      const lo = parseInt(x[1],16), hi = parseInt(x[2],16);
      if(x[1].length >= 4) map.__two = true;
      if(x[4]){
        const base = parseInt(x[4],16);
        for(let k=lo;k<=hi && k-lo<4096;k++) map[k] = String.fromCharCode(base + (k-lo));
      } else {
        const items = x[5].match(/<([0-9A-Fa-f]+)>/g) || [];
        items.forEach((it,k)=>{ map[lo+k] = hexToUnicode(it.slice(1,-1)); });
      }
    }
  }
  return map;
}
const badChar = v => v === undefined || v === '' || v === '\u0000';
function decodeStr(str, map, twoByte){
  if(!map) return str;
  const fb = map.__fb;
  let out = '';
  if(twoByte){
    for(let i=0;i+1<str.length;i+=2){
      const code = (str.charCodeAt(i)<<8) | str.charCodeAt(i+1);
      let v = map[code];
      if(badChar(v) && fb) v = fb[code];
      out += badChar(v) ? ' ' : v;
    }
  } else {
    for(let i=0;i<str.length;i++){
      const code = str.charCodeAt(i);
      let v = map[code];
      if(badChar(v) && fb) v = fb[code];
      out += badChar(v) ? (code < 32 ? '' : str[i]) : v;
    }
  }
  return out;
}
/* Ein Inhaltsstrom wird in positionierte Textstücke zerlegt. Manche PDFs
   setzen jeden Buchstaben einzeln – ohne Koordinaten käme dabei nur
   Buchstabensalat heraus. */
function tokenizeContent(c){
  const items = [];
  let i = 0, ops = [], pending = [], inArr = false;
  let font = '', size = 10, scale = 1, lead = 0, charSp = 0, wordSp = 0;
  let lx = 0, ly = 0, tx = 0, ty = 0, idx = 0;

  const flush = () => {
    if(pending.length){
      items.push({ x:tx, y:ty, size:size*scale, font:font, parts:pending,
                   cs:charSp*scale, ws:wordSp*scale, i:idx++ });
      pending = [];
    }
  };
  while(i < c.length){
    const ch = c[i];
    if(ch === '('){ const r = readLiteral(c,i); pending.push(r[0]); i = r[1]; continue; }
    if(ch === '<' && c[i+1] !== '<'){
      const e = c.indexOf('>', i); if(e < 0) break;
      pending.push(hexString(c.slice(i+1,e))); i = e+1; continue;
    }
    if(ch === '['){ inArr = true; i++; continue; }
    if(ch === ']'){ inArr = false; i++; continue; }
    if(ch === '/'){
      const m = /^\/([^\s/\[\]()<>]+)/.exec(c.slice(i));
      if(m){ ops.push({name:m[1]}); i += m[0].length; continue; }
    }
    if(/[-+.\d]/.test(ch)){
      const m = /^[-+]?\d*\.?\d+/.exec(c.slice(i));
      if(m){
        const v = parseFloat(m[0]);
        if(inArr){ if(v < -120) pending.push(null); }   /* null = Wortlücke,
           kein Leerzeichen: in Teil-Schriften ist 0x20 oft ein echter Buchstabe */
        else ops.push(v);
        i += m[0].length; continue;
      }
    }
    const om = /^(T\*|BT|ET|Tf|Tm|Td|TD|TL|Tj|TJ|Tc|Tw|Tz|Ts|Tr|cm|q|Q|'|")/.exec(c.slice(i));
    if(om){
      const op = om[0], n = ops.filter(x=>typeof x === 'number');
      if(op === 'Tf'){
        const f = ops.find(x=>x && x.name); if(f) font = f.name;
        if(n.length) size = n[n.length-1];
      } else if(op === 'Tm' && n.length >= 6){
        const a = n.slice(-6);
        scale = Math.sqrt(Math.abs(a[0]*a[3] - a[1]*a[2])) || 1;
        lx = a[4]; ly = a[5]; tx = lx; ty = ly;
      } else if((op === 'Td' || op === 'TD') && n.length >= 2){
        const a = n.slice(-2);
        if(op === 'TD') lead = -a[1];
        lx += a[0]; ly += a[1]; tx = lx; ty = ly;
      } else if(op === 'TL' && n.length){ lead = n[n.length-1];
      } else if(op === 'Tc' && n.length){ charSp = n[n.length-1];
      } else if(op === 'Tw' && n.length){ wordSp = n[n.length-1];
      } else if(op === 'T*'){ ly -= lead; tx = lx; ty = ly;
      } else if(op === 'BT'){ lx = ly = tx = ty = 0;
      } else if(op === 'Tj' || op === 'TJ'){ flush();
      } else if(op === "'" || op === '"'){ ly -= lead; tx = lx; ty = ly; flush(); }
      ops = []; i += op.length; continue;
    }
    const w = /^[A-Za-z*'"]+/.exec(c.slice(i));
    if(w){ ops = []; i += w[0].length; continue; }
    i++;
  }
  flush();
  return items;
}

/* Wie gut passt eine Zeichentabelle zu den Zeichen dieser Schrift? */
function coverage(map, strs){
  const two = !!map.__two;
  let hit=0, all=0;
  for(const v of strs){
    if(two){ for(let i=0;i+1<v.length;i+=2){ all++;
      if(map[(v.charCodeAt(i)<<8)|v.charCodeAt(i+1)] !== undefined) hit++; } }
    else { for(let i=0;i<v.length;i++){ all++;
      if(map[v.charCodeAt(i)] !== undefined) hit++; } }
  }
  return all ? hit/all : 0;
}
/* Ungefähre Buchstabenbreiten (Helvetica-Maße, in em). Ohne sie hält die App
   den Abstand hinter einem breiten „m“ für ein Leerzeichen. */
const CW = {' ':.278,'!':.278,'"':.355,'#':.556,'$':.556,'%':.889,'&':.667,"'":.191,
 '(':.333,')':.333,'*':.389,'+':.584,',':.278,'-':.333,'.':.278,'/':.278,':':.278,
 ';':.278,'<':.584,'=':.584,'>':.584,'?':.556,'@':1.015,'[':.278,']':.278,'_':.556,
 '`':.333,'{':.334,'|':.26,'}':.334,'·':.333,'–':.556,'—':1,'’':.191,'„':.333,'“':.333,
 'a':.556,'b':.556,'c':.5,'d':.556,'e':.556,'f':.278,'g':.556,'h':.556,'i':.222,
 'j':.222,'k':.5,'l':.222,'m':.833,'n':.556,'o':.556,'p':.556,'q':.556,'r':.333,
 's':.5,'t':.278,'u':.556,'v':.5,'w':.722,'x':.5,'y':.5,'z':.5,'ß':.611,
 'A':.667,'B':.667,'C':.722,'D':.722,'E':.667,'F':.611,'G':.778,'H':.722,'I':.278,
 'J':.5,'K':.667,'L':.556,'M':.833,'N':.722,'O':.778,'P':.667,'Q':.778,'R':.722,
 'S':.667,'T':.611,'U':.722,'V':.667,'W':.944,'X':.667,'Y':.667,'Z':.611};
const UML = {'ä':'a','ö':'o','ü':'u','Ä':'A','Ö':'O','Ü':'U','é':'e','è':'e','à':'a',
  'ﬁ':'fi','ﬂ':'fl'};
function textWidth(t, size){
  let w = 0;
  for(const ch of String(t||'')){
    const c = UML[ch] || ch;
    if(c.length > 1){ w += textWidth(c, 1); continue; }
    w += (CW[c] !== undefined) ? CW[c] : (/[0-9]/.test(c) ? .556 : .55);
  }
  return w * size;
}
const median = a => { if(!a.length) return 0;
  const b = a.slice().sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; };

/* Textstücke zu Zeilen bündeln: gleiche Höhe = eine Zeile, Lücken = Leerzeichen */
function itemsToLines(items, cmaps, byName){
  if(!items.length) return [];
  const byFont = {};
  items.forEach(it=>{
    const raw = it.parts.filter(x=> x !== null);
    if(raw.length) (byFont[it.font] = byFont[it.font] || []).push.apply(byFont[it.font], raw);
  });
  const chosen = {};
  for(const f in byFont){
    /* Erst unter den Tabellen suchen, die das PDF dieser Schrift zuordnet.
       Nur wenn es keine gibt, alle durchprobieren. */
    const cands = (byName && byName[f] && byName[f].length) ? byName[f] : cmaps;
    let best = null, score = (cands === cmaps) ? 0.35 : -1;
    for(const cm of cands){ const sc = coverage(cm, byFont[f]); if(sc > score){ score = sc; best = cm; } }
    chosen[f] = best;
  }
  items.forEach(it=>{
    const cm = chosen[it.font];
    it.text = it.parts.map(x=> x === null ? ' '
      : (cm ? decodeStr(x, cm, !!cm.__two) : x)).join('');
  });

  /* Läuft y nach unten oder nach oben? Die Reihenfolge im Datenstrom verrät es. */
  let down = 1, bestCorr = -2;
  [1,-1].forEach(dir=>{
    const sorted = items.slice().sort((a,b)=> dir*(a.y-b.y) || a.x-b.x);
    let inv = 0;
    for(let k=1;k<sorted.length;k++) if(sorted[k].i < sorted[k-1].i) inv++;
    const corr = 1 - 2*inv/Math.max(1,sorted.length-1);
    if(corr > bestCorr){ bestCorr = corr; down = dir; }
  });

  const sorted = items.slice().sort((a,b)=> down*(a.y-b.y) || a.x-b.x);
  const tol = Math.max(1.2, median(items.map(x=>x.size)) * 0.5);
  const lines = [];
  let cur = null;
  for(const it of sorted){
    if(!cur || Math.abs(it.y - cur.y0) > tol){
      cur = { y0:it.y, y:down*it.y, size:it.size, items:[it] };
      lines.push(cur);
    } else cur.items.push(it);
  }
  return lines.map(l=>{
    l.items.sort((a,b)=>a.x-b.x);
    let text = '', endX = null;
    for(const it of l.items){
      if(endX !== null && it.x - endX > it.size*0.34 && !/\s$/.test(text)) text += ' ';
      text += it.text;
      endX = it.x + textWidth(it.text, it.size) +
             (it.cs||0) * (it.text ? it.text.length : 1) +
             (it.ws||0) * ((it.text||'').split(' ').length - 1);
    }
    l.text = text.replace(/\s+/g,' ').trim();
    l.x = l.items[0].x;
    l.endX = endX;
    l.size = median(l.items.map(x=>x.size));
    return l;
  }).filter(l=>l.text);
}

/* Lesereihenfolge bei mehrspaltigen Seiten: abwechselnd waagrecht und
   senkrecht schneiden, wie man es mit einer Schere täte. */
function xyCut(lines, depth){
  depth = depth || 0;
  if(lines.length <= 1 || depth > 7) return lines.slice().sort((a,b)=>a.y-b.y || a.x-b.x);
  const byY = lines.slice().sort((a,b)=>a.y-b.y);
  const medH = median(byY.map(l=>l.size)) || 10;
  const bands = [[byY[0]]];
  for(let i=1;i<byY.length;i++){
    if(byY[i].y - byY[i-1].y > medH*2.0) bands.push([byY[i]]);
    else bands[bands.length-1].push(byY[i]);
  }
  if(bands.length > 1){
    let out = [];
    bands.forEach(b=> out = out.concat(xyCut(b, depth+1)));
    return out;
  }
  const cols = splitColumns(lines);
  if(cols){
    let out = [];
    cols.forEach(cl=> out = out.concat(xyCut(cl, depth+1)));
    return out;
  }
  return byY;
}
function splitColumns(lines){
  if(lines.length < 4) return null;
  /* Die Lücke zwischen zwei Spalten findet man nur an den einzelnen Textstücken.
     Auf Zeilenebene ist sie zugedeckt, weil eine Zeile links beginnt und rechts
     endet – dazwischen steht aber nichts. */
  const parts = [];
  lines.forEach(l => l.items.forEach(it=>{
    parts.push({ a: it.x, b: it.x + textWidth(it.text, it.size) });
  }));
  if(parts.length < 8) return null;
  const x0 = Math.min.apply(null, parts.map(p=>p.a));
  const x1 = Math.max.apply(null, parts.map(p=>p.b));
  const width = x1 - x0;
  if(width <= 0) return null;
  const N = 240, bins = new Array(N).fill(0);
  parts.forEach(p=>{
    const a = Math.max(0, Math.floor((p.a - x0)/width*N));
    const b = Math.min(N-1, Math.ceil((p.b - x0)/width*N));
    for(let k=a;k<=b;k++) bins[k] = 1;
  });
  let best = null, run = 0;
  const consider = (a,b) => {
    const w = b-a+1;
    if(a <= 2 || b >= N-3) return;             /* Rand zählt nicht */
    if(w < N*0.05) return;                     /* zu schmal für eine echte Spalte */
    if(!best || w > best.w) best = { a:a, b:b, w:w };
  };
  for(let k=0;k<N;k++){
    if(!bins[k]) run++;
    else { if(run > 0) consider(k-run, k-1); run = 0; }
  }
  if(run > 0) consider(N-run, N-1);
  if(!best) return null;
  const cutX = x0 + ((best.a + best.b)/2) / N * width;

  /* Zeilen, die über die Lücke reichen, werden an ihr zerschnitten */
  const left = [], right = [];
  lines.forEach(l=>{
    const a = l.items.filter(it=>it.x < cutX), b = l.items.filter(it=>it.x >= cutX);
    if(a.length) left.push(rebuildLine(l, a));
    if(b.length) right.push(rebuildLine(l, b));
  });
  if(left.length < 2 || right.length < 2) return null;
  const share = right.length / (left.length + right.length);
  if(share < 0.12 || share > 0.88) return null;   /* nur ein Ausreißer, keine Spalte */
  /* Eine echte Spalte hat Breite. Sonst trennt man nur die Mengenangaben von
     den Zutatennamen – und reißt zusammengehörende Zeilen auseinander. */
  const spanOf = ls => Math.max.apply(null, ls.map(l=>l.endX)) -
                       Math.min.apply(null, ls.map(l=>l.x));
  if(spanOf(left) < width*0.2 || spanOf(right) < width*0.2) return null;
  return [left, right];
}
/* Aus einer Teilmenge von Textstücken wieder eine Zeile bauen */
function rebuildLine(src, items){
  items = items.slice().sort((a,b)=>a.x-b.x);
  let text = '', endX = null;
  for(const it of items){
    if(endX !== null && it.x - endX > it.size*0.34 && !/\s$/.test(text)) text += ' ';
    text += it.text;
    endX = it.x + textWidth(it.text, it.size) +
           (it.cs||0) * (it.text ? it.text.length : 1) +
           (it.ws||0) * ((it.text||'').split(' ').length - 1);
  }
  return { y0:src.y0, y:src.y, size:median(items.map(x=>x.size)), items:items,
           text:text.replace(/\s+/g,' ').trim(), x:items[0].x, endX:endX };
}

/* Bleibt als einfacher Einstieg erhalten */
function contentToText(c, map, twoByte){
  const cm = map ? [Object.assign({__two:twoByte}, map)] : [];
  return xyCut(itemsToLines(tokenizeContent(c), cm, null)).map(l=>l.text).join('\n');
}

/* Im PDF steht schwarz auf weiß, welche Schrift welche Zeichentabelle benutzt:
   /Resources /Font << /F4 4 0 R >> und im Font-Objekt /ToUnicode 52 0 R.
   Das ist verlässlicher als jedes Raten. */
/* Manche PDFs lassen für einzelne Zeichen die Zuordnung offen – dann steht
   dort nichts oder ein Nullzeichen. Weil alle Teil-Schriften eines Dokuments
   in der Regel dieselben Zeichencodes benutzen, hilft eine gemeinsame Tabelle
   aus allen Schriften als Rückfallebene. */
function buildFallback(cmaps){
  const votes = { one:{}, two:{} };
  cmaps.forEach(cm=>{
    const bucket = cm.__two ? votes.two : votes.one;
    for(const k in cm){
      if(k === '__two' || k === '__fb') continue;
      const v = cm[k];
      if(v === undefined || v === '' || v === '\u0000') continue;
      (bucket[k] = bucket[k] || {})[v] = (bucket[k][v] || 0) + 1;
    }
  });
  const pick = b => {
    const out = {};
    for(const k in b){
      out[k] = Object.keys(b[k]).sort((x,y)=> b[k][y]-b[k][x] || x.localeCompare(y))[0];
    }
    return out;
  };
  const fb = { one:pick(votes.one), two:pick(votes.two) };
  cmaps.forEach(cm=>{ cm.__fb = cm.__two ? fb.two : fb.one; });
  return fb;
}

function fontNameMap(raw, byObj){
  const fontToUni = {};
  const re = /\/ToUnicode\s+(\d+)\s+0\s+R/g; let m;
  while((m = re.exec(raw))){
    const before = raw.lastIndexOf(' obj', m.index);
    if(before < 0) continue;
    const on = /(\d+)\s+0\s+obj\s*$/.exec(raw.slice(Math.max(0,before-24), before+4));
    if(on) fontToUni[on[1]] = m[1];
  }
  /* Ein Dokument kann denselben Namen (z. B. /F7) auf mehreren Seiten für
     verschiedene Teil-Schriften benutzen. Deshalb alle Kandidaten sammeln und
     später die passende auswählen. */
  const byName = {};
  const rf = /\/Font\s*<<([\s\S]{0,4000}?)>>/g;
  while((m = rf.exec(raw))){
    const rr = /\/([^\s/<>\[\]]+)\s+(\d+)\s+0\s+R/g; let x;
    while((x = rr.exec(m[1]))){
      const uni = fontToUni[x[2]];
      if(uni && byObj[uni]){
        const list = byName[x[1]] = byName[x[1]] || [];
        if(list.indexOf(byObj[uni]) < 0) list.push(byObj[uni]);
      }
    }
  }
  return byName;
}

async function pdfToText(buffer){
  const bytes = new Uint8Array(buffer);
  const raw = bytesToLatin(bytes);
  const contents = [], cmaps = [], byObj = {};
  const re = /stream\r?\n?/g; let m;
  while((m = re.exec(raw))){
    const start = m.index + m[0].length;
    let end = raw.indexOf('endstream', start);
    if(end < 0) break;
    re.lastIndex = end + 9;              /* sofort weiterspringen, sonst verirrt sich
                                            die Suche in den Binärdaten */
    /* nur den Kopf des aktuellen Objekts betrachten – sonst schwappen die
       Angaben des vorherigen Objekts herein */
    const ctx = raw.slice(Math.max(0, m.index-600), m.index);
    const oi = ctx.lastIndexOf(' obj');
    const dict = oi >= 0 ? ctx.slice(oi+4) : ctx.slice(-140);
    if(/\/Image|\/DCTDecode|\/JPXDecode|\/OpenType|\/FontFile/.test(dict)) continue;
    while(end > start && (raw[end-1] === '\n' || raw[end-1] === '\r')) end--;
    const len = /\/Length\s+(\d+)[\s\/>]/.exec(dict);
    if(len && start + (+len[1]) <= end + 2) end = start + (+len[1]);
    let data = bytes.subarray(start, end);
    if(/\/FlateDecode/.test(dict)){
      const inf = await inflate(data);
      if(!inf) continue;
      data = inf;
    }
    const content = bytesToLatin(data);
    if(/beginbf(char|range)/.test(content)){
      const cm = parseCMap(content, {});
      /* auch winzige Tabellen zählen – manche Schriften enthalten nur ein
         einziges Zeichen, etwa ein „ß“ oder eine Ligatur */
      if(Object.keys(cm).some(k => k !== '__two')){
        cmaps.push(cm);
        const on = /(\d+)\s+0\s+obj\s*$/.exec(ctx.slice(0, oi+4));
        if(on) byObj[on[1]] = cm;
      }
      continue;
    }
    if(/(Tj|TJ)/.test(content)) contents.push(content);
  }
  /* Bewusst keine gemeinsame Rückfalltabelle: erfundene Buchstaben sind
     schlimmer als eine Lücke, die man im Zuordnungsschritt sieht. */
  const byName = fontNameMap(raw, byObj);
  const text = contents.map(c =>
    xyCut(itemsToLines(tokenizeContent(c), cmaps, byName)).map(l=>l.text).join('\n')
  ).join('\n');
  return text.replace(/\u0000/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n')
             .split('\n').map(l=>l.trim()).join('\n').trim();
}

/* =========================================================================
   Zuordnen: Kein Erkenner trifft jedes PDF-Layout. Statt zu raten zeigt die
   App, was sie gelesen hat, schlägt eine Einteilung vor – und du korrigierst
   sie mit einem Fingertipp.
   ========================================================================= */
let asgLines = [];

/* Vorschlag, welche Zeile was ist */
function preClassify(lines){
  const out = [];
  let titleDone = false, seenIng = false, seenStep = false;
  const isUpper = l => l === l.toUpperCase() && /[A-ZÄÖÜ]/.test(l);
  for(const raw of lines){
    const l = raw.trim();
    if(!l) continue;
    let role = 'x';
    const amount = /^(\d+[.,]?\d*|[½¼¾⅓⅔]|etwas|n\.\s?B\.)(\s|$)/i.test(l);
    const longish = l.length > 55;
    const stepNo  = /^\d{1,2}\s+\S/.test(l) && l.length > 25;

    const nutriLine = /\bkcal\b/i.test(l) || /ballaststoff/i.test(l)
      || /^(eiweiss|eiweiß|kohlenhydrate|fett)\b/i.test(l)
      || /^\s*\d+([.,]\d+)?(\s+\d+([.,]\d+)?\s*g\b){2,}/.test(l)
      || /^gesamt\b/i.test(l) || /schätzwerte/i.test(l)
      || /^pro\s+\w+/i.test(l);          /* „pro Wrap“, „pro Portion“ */
    if(/^(min|std|gesamt|kcal|eiweiss|eiweiß|fett|kohlenhydrate|ballaststoffe)$/i.test(l)
       || /^~?\d+\s*(min|g|kcal)$/i.test(l) || l.length < 3 || nutriLine) role = 'x';
    else if(!titleDone && !isUpper(l) && l.length > 3 && l.length < 70 && !amount){
      role = 't'; titleDone = true;
    }
    else if(isUpper(l) && l.length < 40) role = 'x';           /* Rubriküberschrift */
    else if(stepNo || (longish && (seenIng || seenStep))){ role = 's'; seenStep = true; }
    else if(amount && l.length < 60 && !seenStep){ role = 'z'; seenIng = true; }
    else if(longish){ role = 's'; seenStep = true; }
    else if(seenStep) role = 's';
    else role = 'x';
    out.push({ text:l, role:role });
  }
  return out;
}
function openAssign(text, backTo){
  asgLines = preClassify(String(text||'').split('\n'));
  if(!asgLines.length){ toast('Es war kein Text zu finden.'); return; }
  openModal('Zeilen zuordnen', assignHTML(),
    ['<button class="btn primary" id="asgOk">Übernehmen</button>',
     '<button class="btn ghost" id="asgBack">Zurück</button>'],
    m => bindAssign(m, backTo));
}
function assignHTML(){
  const n = r => asgLines.filter(l=>l.role===r).length;
  return '<div class="asg-head">'+
      '<p class="hint" style="margin:0">Tipp auf T, Z oder S, um eine Zeile zum '+
        'Titel, zu einer Zutat oder zu einem Schritt zu machen. Alles mit „–“ wird '+
        'nicht übernommen. Mit „ab hier“ setzt du alles Folgende auf einmal.</p>'+
      '<div class="asg-sum"><b>'+n('t')+'</b> Titel · <b>'+n('z')+'</b> Zutaten · '+
        '<b>'+n('s')+'</b> Schritte · '+n('x')+' übersprungen</div></div>'+
    asgLines.map((l,k)=>
      '<div class="asg-row '+l.role+'">'+
        '<span class="asg-roles">'+
          ['t','z','s','x'].map(r=>'<button data-set="'+k+'|'+r+'" class="'+
            (l.role===r?'on':'')+'">'+(r==='x'?'–':r.toUpperCase())+'</button>').join('')+
        '</span>'+
        '<span class="asg-txt">'+esc(l.text)+'</span>'+
        '<span class="asg-from"><button data-from="'+k+'|z">ab hier Zutaten</button>'+
          '<button data-from="'+k+'|s">ab hier Schritte</button></span>'+
      '</div>').join('');
}
function bindAssign(m, backTo){
  const redraw = () => { m.querySelector('.modal-body').innerHTML = assignHTML();
    bindAssign(m, backTo); };
  m.querySelector('.modal-body').onclick = e => {
    const set = e.target.closest('[data-set]');
    if(set){ const p = set.dataset.set.split('|');
      asgLines[+p[0]].role = p[1]; redraw(); return; }
    const from = e.target.closest('[data-from]');
    if(from){ const p = from.dataset.from.split('|');
      for(let i=+p[0]; i<asgLines.length; i++) asgLines[i].role = p[1];
      redraw(); }
  };
  m.querySelector('#asgBack').onclick = () => { closeModal(); if(backTo) backTo(); };
  m.querySelector('#asgOk').onclick = () => {
    const r = assignToRecipe(asgLines);
    if(!r.title && !r.ingredients[0].n && !r.steps[0]){
      toast('Bitte mindestens eine Zutat oder einen Schritt zuordnen.'); return; }
    closeModal(); editRecipe(null, r);
  };
}
/* Aus den zugeordneten Zeilen ein Rezept bauen */
function assignToRecipe(lines){
  const out = blankRecipe(); out.ingredients = []; out.steps = [];
  let step = [];
  const flush = () => { if(step.length){ out.steps.push(joinLines(step)); step = []; } };
  for(const l of lines){
    if(l.role === 't'){ if(!out.title) out.title = l.text; continue; }
    if(l.role === 'z'){ flush(); out.ingredients.push(parseIngredient(l.text)); continue; }
    if(l.role === 's'){
      /* Nummer am Zeilenanfang heißt: neuer Schritt. Sonst gehört die Zeile zum
         vorherigen – PDFs brechen Sätze mitten im Satz um. */
      if(/^\d{1,2}\s+\S/.test(l.text)) flush();
      /* Zeitangaben aus der Randspalte kleben am Zeilenende */
      step.push(l.text.replace(/^\d{1,2}\s+/,'')
                      .replace(/\s+(\d{1,3}|MIN|Min\.?|STD)$/,'').trim());
      continue;
    }
    flush();
  }
  flush();
  /* Zeitangaben aus Randspalten wegputzen */
  out.steps = out.steps.map(t=>tidy(t.replace(/\s*\b\d{1,3}\s+MIN\b/gi,''))).filter(Boolean);
  out.title = tidy(out.title);
  out.ingredients.forEach(i=>{ i.n = tidy(i.n); });
  if(!out.ingredients.length) out.ingredients = [{a:null,u:'g',n:''}];
  if(!out.steps.length) out.steps = [''];
  return out;
}
/* PDFs setzen Ligaturen als eigenes Zeichen und oft mit Abstand davor:
   aus „Thun ﬁsch“ wird wieder „Thunfisch“. */
function tidy(t){
  return String(t||'')
    .replace(/[\u0000-\u001f]/g,'')
    .replace(/([A-Za-zÄÖÜäöüß]{2})\s*(ﬁ|ﬂ|ﬀ|ﬃ|ﬄ)\s*([A-Za-zÄÖÜäöüß])/g,
      (m,a,lig,b)=> a + ({'ﬁ':'fi','ﬂ':'fl','ﬀ':'ff','ﬃ':'ffi','ﬄ':'ffl'})[lig] + b)
    .replace(/ﬁ/g,'fi').replace(/ﬂ/g,'fl').replace(/ﬀ/g,'ff')
    .replace(/\s+/g,' ').trim();
}
function parseIngredient(line){
  const t = line.trim();
  const m = /^(\d+[.,]?\d*|[½¼¾]|etwas|n\.\s?B\.)\s*(.*)$/i.exec(t);
  if(!m) return { a:null, u:'n. B.', n:t };
  let a = null, u = 'Stück', rest = m[2] || '';
  const head = m[1];
  if(/^etwas$/i.test(head) || /^n\./i.test(head)) u = 'n. B.';
  else a = head==='½'?.5 : head==='¼'?.25 : head==='¾'?.75
         : parseFloat(head.replace(',','.'));
  const w = rest.split(' ');
  const first = (w[0]||'').replace(/\.$/,'');
  const PL = { zehe:'Zehe', zehen:'Zehe', scheibe:'Scheibe', scheiben:'Scheibe',
    sch:'Scheibe', bl:'Blatt', pck:'Päckchen', tl:'TL', el:'EL',
    blatt:'Blatt', 'blätter':'Blatt', bund:'Bund', 'bünde':'Bund', glas:'Glas',
    'gläser':'Glas', becher:'Becher', prise:'Prise', prisen:'Prise', dose:'Dose',
    dosen:'Dose', stange:'Stange', stangen:'Stange', zweig:'Zweig', zweige:'Zweig',
    'päckchen':'Päckchen' };
  const known = UNITS.find(x=>x.u.toLowerCase() === first.toLowerCase());
  if(a !== null && known){ u = known.u; rest = w.slice(1).join(' '); }
  else if(a !== null && PL[first.toLowerCase()]){ u = PL[first.toLowerCase()];
    rest = w.slice(1).join(' '); }
  return { a:a, u:u, n:rest.trim() || t };
}

/* =========================================================================
   Austauschformat — der zuverlässigste Weg ins Buch
   Ein Rezept in dieser festen Form wird ohne Zuordnungsschritt übernommen.
   Der passende Prompt für den Claude-Chat steht unten in PROMPT_TEXT.
   ========================================================================= */
const EX_UNITS = ['g','kg','ml','l','EL','TL','Msp.','Prise','Stück','Bund','Zehe',
  'Scheibe','Dose','Glas','Becher','Blatt','Kopf','Stange','Zweig','Päckchen','n. B.'];

const PROMPT_TEXT =
`Lies das Rezept im angehängten Bild oder PDF und gib es exakt in der unten
stehenden Form zurück. Keine Einleitung, kein Kommentar, nichts weglassen.

Regeln:
- Übernimm die Mengen so, wie sie im Rezept stehen. Rechne nichts um.
- Schreib in die Zeile "Ergibt", wofür die Mengen reichen — etwa "4 Portionen",
  "6 Stück", "1 Brot", "1 Bowl".
- Nur metrische Einheiten, und nur diese Bezeichnungen:
  ${EX_UNITS.join(', ')}
- Zutaten: eine pro Zeile, Menge und Einheit vor dem senkrechten Strich,
  Name dahinter. Ohne feste Menge schreibst du "n. B." (nach Belieben).
- Zusatzangaben wie "abgetropft" oder "fein gehackt" hängst du in Klammern
  an den Namen.
- Zubereitung: ein Arbeitsschritt pro Zeile, durchnummeriert. Fasse zu
  kleinteilige Schritte zusammen, aber erfinde nichts dazu.
- Kapitel ist genau eines von: Vorspeise, Hauptspeise, Nachspeise, Snack,
  Getränk, Gewürz.
- Höchstens 3 Tags, zum Beispiel Land, Ernährungsform, Eigenschaft.
- Nährwerte je Portion schätzen, wenn sie nicht dabeistehen.

Form (genau so, mit den Überschriften in Großbuchstaben):

REZEPT
Titel: <Name des Gerichts>
Kapitel: <Vorspeise|Hauptspeise|Nachspeise|Snack|Getränk|Gewürz>
Tags: <Tag, Tag, Tag>
Ergibt: <Zahl> <Portionen|Stück|Bowls|Wraps|Brot|Gläser>
Vorbereitung: <z. B. 20 Min>
Kochen: <z. B. 30 Min — oder Backen/Braten/Garen/Kühlen/Ziehen>
Schwierigkeit: <Leicht|Mittel|Anspruchsvoll>

ZUTATEN
500 g | Hähnchenbrustfilet
2 Zehe | Knoblauch (fein gehackt)
n. B. | Salz

ZUBEREITUNG
1. Erster Arbeitsschritt.
2. Zweiter Arbeitsschritt.

TIPP: <ein Satz, oder weglassen>
NÄHRWERTE: <kcal> kcal | <x> g Eiweiß | <x> g Fett | <x> g Kohlenhydrate`;

const FRAC_IN = { '½':.5, '¼':.25, '¾':.75, '⅓':1/3, '⅔':2/3, '⅛':.125 };
function parseAmount(t){
  t = String(t||'').trim();
  if(!t || /^n\.\s?B\.$/i.test(t)) return { a:null, u:'n. B.' };
  const m = /^([\d.,/]+|[½¼¾⅓⅔⅛])\s*(.*)$/.exec(t);
  if(!m) return { a:null, u:'n. B.' };
  let a;
  if(FRAC_IN[m[1]] !== undefined) a = FRAC_IN[m[1]];
  else if(m[1].indexOf('/') > 0){ const q = m[1].split('/'); a = (+q[0])/(+q[1]); }
  else a = parseFloat(m[1].replace(',','.'));
  const rest = (m[2]||'').trim();
  const hit = UNITS.find(x=>x.u.toLowerCase() === rest.toLowerCase()) ||
              UNITS.find(x=>x.u.toLowerCase() === rest.toLowerCase().replace(/n$/,''));
  return { a: isNaN(a) ? null : a, u: hit ? hit.u : (rest || 'Stück') };
}
function parseExchange(txt){
  /* Chat-Antworten kommen oft mit Fettschrift, Aufzählungspunkten oder in
     einem Code-Block. Das stört das Format nicht. */
  const L = String(txt||'').split('\n').map(x=>
    x.replace(/\s+$/,'')
     .replace(/^\s*```.*$/,'')
     .replace(/^\s*[-*•]\s+/,'')
     .replace(/\*\*/g,'')
     .replace(/^\s*#+\s*/,''));
  if(!L.some(l=>/^\s*REZEPT\s*$/i.test(l)) || !L.some(l=>/^\s*ZUTATEN\s*$/i.test(l)))
    return null;
  const out = blankRecipe(); out.ingredients = []; out.steps = [];
  let mode = 'kopf';
  const CH = {}; CHAPTERS.forEach(c=> CH[c.one.toLowerCase()] = c.id);
  for(let raw of L){
    const l = raw.trim();
    if(!l) continue;
    if(/^REZEPT$/i.test(l)){ mode = 'kopf'; continue; }
    if(/^ZUTATEN$/i.test(l)){ mode = 'zutaten'; continue; }
    if(/^ZUBEREITUNG$/i.test(l)){ mode = 'schritte'; continue; }
    if(/^TIPP\s*:/i.test(l)){ out.tip = l.replace(/^TIPP\s*:\s*/i,''); continue; }
    if(/^N(Ä|AE)HRWERTE\s*:/i.test(l)){
      const v = {}, teile = l.replace(/^[^:]*:\s*/,'').split('|');
      teile.forEach(t=>{
        const n = parseFloat(String(t).replace(',','.'));
        if(isNaN(n)) return;
        if(/kcal/i.test(t)) v.kcal = n;
        else if(/eiwei/i.test(t)) v.protein = n;
        else if(/fett/i.test(t)) v.fat = n;
        else if(/kohlenhydrat/i.test(t)) v.carbs = n;
      });
      if(v.kcal) out.nutriManual = { kcal:v.kcal, protein:v.protein||0,
                                     fat:v.fat||0, carbs:v.carbs||0 };
      continue;
    }
    if(mode === 'kopf'){
      const kv = /^([A-Za-zÄÖÜäöü ]+)\s*:\s*(.*)$/.exec(l);
      if(!kv) continue;
      const k = kv[1].trim().toLowerCase(), v = kv[2].trim();
      if(k === 'titel') out.title = v;
      else if(k === 'kapitel') out.chapter = CH[v.toLowerCase()] || 'hauptspeise';
      else if(k === 'tags') out.tags = v.split(',').map(x=>x.trim())
        .filter(Boolean).slice(0, MAX_TAGS);
      else if(k === 'vorbereitung') out.prep = v;
      else if(k === 'ergibt'){
        const g = /^\s*([\d.,]+)\s*(.*)$/.exec(v);
        if(g){ out.servings = Math.max(1, parseFloat(g[1].replace(',','.'))||4);
               if(g[2].trim()) out.servingsLabel = g[2].trim(); }
      }
      else if(k === 'schwierigkeit') out.difficulty = v;
      else if(['kochen','backen','braten','garen','kühlen','ziehen'].indexOf(k) >= 0){
        out.cookLabel = kv[1].trim()[0].toUpperCase() + kv[1].trim().slice(1).toLowerCase();
        out.cook = v;
      }
      continue;
    }
    if(mode === 'zutaten'){
      const parts = l.split('|');
      if(parts.length < 2){ out.ingredients.push(parseIngredient(l)); continue; }
      const men = parseAmount(parts[0]);
      out.ingredients.push({ a:men.a, u:men.u, n:parts.slice(1).join('|').trim() });
      continue;
    }
    if(mode === 'schritte'){
      const t = l.replace(/^\d{1,2}[.)]\s*/,'').trim();
      if(t) out.steps.push(t);
    }
  }
  if(!out.title) return null;
  if(!out.ingredients.length) out.ingredients = [{a:null,u:'g',n:''}];
  if(!out.steps.length) out.steps = [''];
  return out;
}

      m.querySelector('#iPdf').onchange = async e => {

              'steckt kein auslesbarer Text. Vermutlich ist es eine eingescannte Seite, '+

            return;
          }
          m.querySelector('#iText').value = txt;
          st.innerHTML = '<p class="hint" style="margin:-8px 0 14px">Text übernommen ('+
            txt.split('\n').filter(Boolean).length+' Zeilen). Bitte unten durchsehen – '+
            'PDFs bringen oft Kopfzeilen und Seitenzahlen mit, die hier nicht '+
            'hineingehören.</p>';
        }catch(err){
          st.innerHTML = '<div class="warn" style="margin:-4px 0 14px">Die Datei konnte '+
            'nicht gelesen werden. Kopier den Text notfalls direkt aus dem PDF-Programm '+
            'hier hinein.</div>';
        }
      };
      m.querySelector('#iPhoto').onchange = e => {
        const f = e.target.files[0]; if(!f) return;
        const url = URL.createObjectURL(f);

          'border:1px solid var(--rule);margin-bottom:14px">'+
          '<p class="hint" style="margin:-8px 0 14px">Foto liegt als Vorlage bereit – '+
          'tipp den Text daneben ab.</p>';
      };
      m.querySelector('#iGo').onclick = () => {
        const txt = m.querySelector('#iText').value;
        if(!txt.trim()){ toast('Bitte erst einen Text einfügen oder ein PDF laden.'); return; }
        /* Ein PDF aus dieser App lässt sich exakt zurücklesen – dann direkt weiter */
        const ex = parseExchange(txt);
        if(ex){ closeModal(); toast('Austauschformat erkannt – direkt übernommen.');
          editRecipe(null, ex); return; }
        const own = parseOwnExport(txt);
        closeModal();
        if(own && own.title && own.ingredients.length > 1){
          toast('Eigenes Buchformat erkannt – direkt übernommen.');
          editRecipe(null, own);
        } else openAssign(txt, importDialog);
      };
    });
}
/* Gesperrte Großbuchstaben aus dem PDF wieder zusammenziehen:
   „V O R S P E I S E“ -> „VORSPEISE“ */
function unspace(l){
  const t = l.split(' ');
  return (t.length >= 4 && t.filter(x=>x.length===1).length >= t.length*0.8)
    ? t.join('') : l;
}
/* Ein PDF, das diese App selbst erzeugt hat, lässt sich exakt zurücklesen –
   so kann man ein Rezept einfach als PDF verschicken. */
/* Zeilenumbrüche aus dem PDF zusammenfügen – nach Trennstrich ohne Leerzeichen */
function joinLines(buf){
  return buf.reduce((acc,l)=> !acc ? l : (/[–-]$/.test(acc) ? acc+l : acc+' '+l), '');
}
function parseOwnExport(txt){
  const L = txt.split('\n').map(x=>tidy(unspace(x.trim()))).filter(Boolean);
  if(!L.some(l => /^PRO PORTION/.test(l))) return null;   /* nicht unser Format */

  const KINDS = {}; CHAPTERS.forEach(c=> KINDS[c.one.toUpperCase()] = c.id);
  const out = blankRecipe(); out.ingredients = []; out.steps = [];
  const steps = {};                     /* nach Schrittnummer, die Spalten laufen
                                           in der Leserichtung durcheinander */
  let curStep = null, expect = 1, tipBuf = null;

  for(let i=0;i<L.length;i++){
    const l = L[i];

    if(KINDS[l] !== undefined && out.title) break;   /* nächstes Rezept beginnt */
    if(KINDS[l] !== undefined && !out.title){
      out.chapter = KINDS[l];
      out.title = L[i+1] || '';
      if(L[i+2] && L[i+2].indexOf('·') >= 0)
        out.tags = L[i+2].split('·').map(t=>t.trim())
          .filter(Boolean).map(t=>t[0]+t.slice(1).toLowerCase()).slice(0, MAX_TAGS);
      i += 2; curStep = null; continue;
    }
    if(/^VORBEREITUNG/.test(l)){
      const labels = l.split(/\s+/), vals = L[i+1] || '';
      const times = vals.match(/\d+\s*(?:Min|Std|Stunden)/gi) || [];
      const port = /(\d+)\s*$/.exec(vals);
      if(port) out.servings = Math.max(1, +port[1]);
      if(labels[labels.length-1]) out.servingsLabel =
        labels[labels.length-1][0] + labels[labels.length-1].slice(1).toLowerCase();
      out.prep = times[0] || '';
      out.cook = times[1] || '';
      if(labels[1]) out.cookLabel = labels[1][0] + labels[1].slice(1).toLowerCase();
      const d = /(Leicht|Mittel|Anspruchsvoll)/.exec(vals);
      if(d) out.difficulty = d[1];
      i++; curStep = null; continue;
    }
    if(/^(ZUTATEN|ZUBEREITUNG|PRO PORTION|NOTIZEN|BEREITS GEKOCHT)/.test(l)){
      curStep = null; continue; }
    const nut = /^(KCAL|EIWEISS|FETT|KOHLENHYDRATE)\s+([\d.,]+)/.exec(l);
    if(nut){
      out.nutriManual = out.nutriManual || {kcal:0,protein:0,fat:0,carbs:0};
      const v = parseFloat(nut[2].replace(',','.'));
      ({KCAL:'kcal', EIWEISS:'protein', FETT:'fat', KOHLENHYDRATE:'carbs'})[nut[1]]
        && (out.nutriManual[({KCAL:'kcal',EIWEISS:'protein',FETT:'fat',
             KOHLENHYDRATE:'carbs'})[nut[1]]] = v);
      curStep = null; continue;
    }
    if(/^Tipp:/.test(l)){ tipBuf = [l.replace(/^Tipp:\s*/,'')]; curStep = 'tip'; continue; }
    if(curStep === 'tip'){
      if(tipBuf) tipBuf.push(l);
      if(/[.!?]$/.test(l)) curStep = null;
      continue;
    }
    /* Ein Arbeitsschritt beginnt mit der nächsten erwarteten Nummer und ist lang.
       „2 Knoblauchzehen“ ist deshalb eine Zutat, „2 Basilikum in Streifen …“ nicht. */
    const st = /^(\d{1,2})\s+(.+)$/.exec(l);
    if(st && +st[1] === expect && st[2].length >= 20){
      curStep = +st[1]; steps[curStep] = [st[2]]; expect++; continue;
    }
    if(/^([\d.,½¼¾]+|n\.\s?B\.)\s/.test(l) && l.length < 60 && curStep === null){
      out.ingredients.push(parseIngredient(l)); continue;
    }
    /* Eindeutige Zutatenzeilen gehören nie zu einem Schritt, auch wenn sie im
       Text hinter einem stehen – die Spalten laufen ineinander. */
    const sicher = /^n\.\s?B\.\s/i.test(l) ||
      /^([\d.,½¼¾]+)\s+(g|kg|ml|l|EL|TL|Msp\.|Prise|St(ü|ue)ck|Bund|Zehen?|Scheiben?|Sch\.|Dosen?|Glas|Becher|Bl(att|\.)|Kopf|Stangen?|Zweige?|Päckchen)\b/i.test(l);
    if(sicher && l.length < 60){ out.ingredients.push(parseIngredient(l)); continue; }
    if(curStep !== null && steps[curStep]){ steps[curStep].push(l); continue; }
    if(/^([\d.,½¼¾]+|n\.\s?B\.)\s/.test(l) && l.length < 60){
      out.ingredients.push(parseIngredient(l)); continue;
    }
  }
  out.steps = Object.keys(steps).map(Number).sort((a,b)=>a-b)
    .map(k=>joinLines(steps[k]));
  if(tipBuf) out.tip = joinLines(tipBuf);
  if(!out.ingredients.length) out.ingredients = [{a:null,u:'g',n:''}];
  if(!out.steps.length) out.steps = [''];
  return out;
}

/* Einfacher Zeilen-Parser: erkennt Mengen, Einheiten und Fließtext-Schritte */
function parseRecipeText(txt){
  const own = parseOwnExport(String(txt||''));
  if(own && own.title && own.ingredients.length > 1) return own;
  const lines = String(txt||'').split(/\r?\n/).map(s=>s.trim());
  if(!lines.some(Boolean)) return null;
  const out = blankRecipe(); out.ingredients=[]; out.steps=[];
  const unitRe = new RegExp('^('+UNITS.map(u=>u.u.replace('.','\\.')).join('|')+
    '|Dosen|Zehen|Scheiben|Bünde|Blätter|Stk)\\b','i');
  let titleSet = false;
  for(const line of lines){
    if(!line) continue;
    if(!titleSet && !/^[\d½¼¾]/.test(line) && line.length<60){ out.title=line; titleSet=true; continue; }
    const m = line.match(/^([\d]+[.,]?\d*|½|¼|¾)\s*(.*)$/);
    if(m && m[2].length < 70){
      let a = m[1]==='½'?.5 : m[1]==='¼'?.25 : m[1]==='¾'?.75 : parseFloat(m[1].replace(',','.'));
      let rest = m[2], u = 'Stück';
      const um = rest.match(unitRe);
      if(um){
        u = ({dosen:'Dose',zehen:'Zehe',scheiben:'Scheibe','bünde':'Bund',
              'blätter':'Blatt',stk:'Stück'})[um[1].toLowerCase()] ||
             (UNITS.find(x=>x.u.toLowerCase()===um[1].toLowerCase())||{}).u || 'Stück';
        rest = rest.slice(um[1].length).trim();
      } else if(/^g\b|^kg\b|^ml\b|^l\b/i.test(rest)){
        u = rest.match(/^\w+/)[0]; rest = rest.replace(/^\w+\s*/,'');
      }
      out.ingredients.push({a:a, u:u, n:rest.replace(/^,\s*/,'')});
      continue;
    }
    if(line.length > 25) out.steps.push(line);
    else if(!out.steps.length) out.ingredients.push({a:null,u:'n. B.',n:line});
    else out.steps.push(line);
  }
  if(!out.ingredients.length) out.ingredients=[{a:null,u:'g',n:''}];
  if(!out.steps.length) out.steps=[''];
  return out;
}

   TEIL 7 — Vorratssuche: was lässt sich aus dem kochen, was da ist?
   ========================================================================= */
let pantrySel = [];          /* gewählte Zutaten */
let pantryChapter = '';      /* gewünschte Mahlzeit */
let pantryStaples = true;    /* Grundvorrat als vorhanden annehmen */

function knownIngredients(){
  const set = {};
  S.recipes.forEach(r => (r.ingredients||[]).forEach(i=>{
    if(i.n) set[canonical(i.n)] = set[canonical(i.n)] || i.n;
  }));
  return Object.keys(set).sort().map(k=>set[k]);
}
/* Wie gut passt ein Rezept zu dem, was da ist? */
function matchRecipe(r, want){
  const need = [], used = [], missing = [];
  (r.ingredients||[]).forEach(i=>{
    if(!i.n) return;
    const k = canonical(i.n);
    if(pantryStaples && isStaple(k)) return;      /* Salz und Öl sind immer da */
    need.push(k);
    if(want.includes(k)) used.push(i.n); else missing.push(i.n);
  });
  return { used, missing, need,
           share: need.length ? used.length/need.length : 0 };
}
function viewIdeas(){
  const want = pantrySel.map(canonical);
  const known = knownIngredients();
  let hits = [];
  if(want.length){
    hits = S.recipes
      .filter(r => !pantryChapter || r.chapter===pantryChapter)
      .map(r => Object.assign({r:r}, matchRecipe(r, want)))
      .filter(h => h.used.length > 0)
      .sort((a,b)=> b.used.length - a.used.length ||
                    a.missing.length - b.missing.length ||
                    b.share - a.share);
  }
  $('#view').innerHTML =
    '<h2 class="section">Was koche ich?</h2>'+
    '<div class="sub">Trag ein, was weg muss. Die App sucht Rezepte, die möglichst '+
      'viel davon verwenden, und sagt dir, was noch fehlt.</div>'+
    '<div class="pantry-box">'+
      '<div class="pantry-in">'+
        '<input type="text" id="pIn" list="ingList" placeholder="Zutat eingeben, z. B. Paprika">'+
        '<datalist id="ingList">'+known.map(n=>'<option value="'+esc(n)+'">').join('')+
        '</datalist>'+
        '<button class="btn" id="pAdd">Hinzufügen</button>'+
      '</div>'+
      (pantrySel.length ? '<div class="pantry-chips">'+pantrySel.map((n,k)=>
        '<button class="chip" data-rm="'+k+'">'+esc(n)+'<b>×</b></button>').join('')+
        '<button class="btn ghost sm" id="pClear">alle entfernen</button></div>' : '')+
      '<div class="row" style="margin-top:16px">'+
        '<span style="font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;'+
        'color:var(--ink-faint)">Mahlzeit</span>'+
        '<button class="chip '+(!pantryChapter?'on':'')+'" data-pc="">Egal</button>'+
        CHAPTERS.map(c=>'<button class="chip '+(pantryChapter===c.id?'on':'')+
          '" data-pc="'+c.id+'">'+esc(c.many)+'</button>').join('')+
      '</div>'+
      '<div class="opt" style="margin-top:6px"><input type="checkbox" id="pStap" '+
        (pantryStaples?'checked':'')+'><div><label for="pStap">Grundvorrat vorhanden</label>'+
        '<div class="d">Salz, Pfeffer, Öl, Essig, Mehl, Zucker und Gewürze zählen '+
        'nicht als fehlend.</div></div></div>'+
    '</div>'+
    (!pantrySel.length
      ? '<div class="empty"><p>Noch keine Zutat eingetragen.</p>'+
        '<p style="font-size:13px">Tipp: Fang mit dem an, was am ehesten schlecht wird.</p></div>'
      : (hits.length ? hits.map(hitHTML).join('')
        : '<div class="empty"><p>Kein Rezept im Buch verwendet diese Zutaten.</p>'+
          '<p style="font-size:13px">Je mehr Rezepte im Buch stehen, desto besser '+
          'werden die Vorschläge.</p></div>'));

  const add = () => {
    const v = $('#pIn').value.trim();
    if(!v) return;
    if(!pantrySel.some(x=>canonical(x)===canonical(v))) pantrySel.push(v);
    $('#pIn').value=''; viewIdeas(); $('#pIn').focus();
  };
  $('#pAdd').onclick = add;
  $('#pIn').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); add(); } };
  $('#pStap').onchange = e => { pantryStaples = e.target.checked; viewIdeas(); };
  $('#view').onclick = e => {
    const rm = e.target.closest('[data-rm]');
    if(rm){ pantrySel.splice(+rm.dataset.rm,1); viewIdeas(); return; }
    if(e.target.id==='pClear'){ pantrySel=[]; viewIdeas(); return; }
    const pc = e.target.closest('[data-pc]');
    if(pc){ pantryChapter = pc.dataset.pc; viewIdeas(); return; }
    const b = e.target.closest('[data-act]');
    if(!b) return;
    const r = S.recipes.find(x=>x.id===b.dataset.id);
    if(!r) return;
    if(b.dataset.act==='show')  showRecipe(r.id);
    if(b.dataset.act==='cook')  startCooking(r.id);
    if(b.dataset.act==='shop'){ addMissingToList(r, pantrySel.map(canonical)); }
  };
}
function hitHTML(h){
  const r = h.r, pct = Math.round(h.share*100);
  const miss = h.missing;
  return '<div class="hit">'+

      (miss.length
        ? '<div class="miss">fehlt noch: <b>'+esc(miss.slice(0,4).join(', '))+

}
function addMissingToList(r, want){
  const m = matchRecipe(r, want);
  let n = 0;
  (r.ingredients||[]).forEach(i=>{
    if(!m.missing.includes(i.n)) return;
    const key = canonical(i.n);
    if(S.shopExtra.some(x=>canonical(x.name)===key)) return;
    S.shopExtra.push({ name:i.n, qty:amountText(i,1), dept:deptOf(i.n),
                       from:r.title });
    n++;
  });
  save();
  toast(n ? n+' Zutaten auf die Einkaufsliste gelegt.' : 'Stand schon auf der Liste.');
}

/* =========================================================================
   TEIL 7b — Einkaufsliste
   ========================================================================= */
function buildShopping(){
  const items = {};
  DAYS.forEach((d,i)=>{
    const day = S.plan.entries[i]; if(!day) return;
    const factor0 = (S.plan.persons[i]||4);
    Object.values(day).forEach(rid=>{
      const r = S.recipes.find(x=>x.id===rid); if(!r) return;
      const factor = factor0 / yieldOf(r);
      (r.ingredients||[]).forEach(ing=>{
        if(!ing.n) return;
        const key = canonical(ing.n)+'|'+ing.u;
        if(!items[key]) items[key] = { name:ing.n, names:{}, unit:ing.u, amount:0,
                                       any:false, dept:deptOf(ing.n), from:new Set(),
                                       key:canonical(ing.n) };
        const it = items[key];
        it.names[ing.n] = (it.names[ing.n]||0) + 1;
        if(ing.a==null || ing.u==='n. B.') it.any = true;
        else it.amount += ing.a*factor;
        it.from.add(r.title);
      });
    });
  });
  const list = Object.values(items).map(it=>{
    it.name = Object.keys(it.names).sort((a,b)=>
      (it.names[b]-it.names[a]) || (a.length-b.length))[0] || it.name;
    let qty;
    if(it.amount===0 && it.any) qty = 'n. B.';
    else if(it.unit==='g' && it.amount>=1000) qty = num(it.amount/1000)+' kg';
    else if(it.unit==='ml' && it.amount>=1000) qty = num(it.amount/1000)+' l';
    else qty = num(it.amount) +
      (it.unit==='Stück' ? '' : ' '+unitLabel(it.unit, it.amount));
    return { name:it.name, key:it.key, qty:qty.trim(), dept:it.dept,
             from:Array.from(it.from) };
  });
  /* von Hand ergänzte Posten */
  (S.shopExtra||[]).forEach(x=> list.push({ name:x.name, key:canonical(x.name),
    qty:x.qty||'', dept:x.dept||'son', from:x.from?[x.from]:['Von Hand ergänzt'],
    extra:true }));
  return list;
}
function groupShopping(items, mode){
  if(mode==='alpha')
    return [{label:'Alle Zutaten von A bis Z',
             items:items.slice().sort((a,b)=>a.name.localeCompare(b.name,'de'))}];
  if(mode==='recipe'){
    const by = {};
    items.forEach(it=> it.from.forEach(t=>{ (by[t]=by[t]||[]).push(it); }));
    return Object.keys(by).sort((a,b)=>a.localeCompare(b,'de'))
      .map(t=>({label:t, items:by[t]}));
  }
  return DEPTS.map(d=>({label:d[1], items:items.filter(i=>i.dept===d[0])
    .sort((a,b)=>a.name.localeCompare(b.name,'de'))})).filter(g=>g.items.length);
}
let doneOpen = false;
function viewShop(){
  const all = buildShopping();
  const mode = S.settings.shopSort;
  const open = all.filter(i=>!S.shopDone[i.key]);
  const done = all.filter(i=> S.shopDone[i.key]);
  const groups = groupShopping(open, mode);
  const modes = [['dept','Nach Supermarkt-Abteilung'],['recipe','Nach Rezept'],
                 ['alpha','Alphabetisch']];
  const line = (it, isDone) =>
    '<div class="shop-item'+(isDone?' done':'')+'"><label>'+
      '<input type="checkbox" data-k="'+esc(it.key)+'" '+(isDone?'checked':'')+'>'+
      '<span class="q">'+esc(it.qty)+'</span>'+
      '<span class="n">'+esc(it.name)+
        (mode!=='recipe' && !isDone
          ? ' <span class="from">· '+esc(it.from.join(', '))+'</span>' : '')+
      '</span></label></div>';

  $('#view').innerHTML =
    '<h2 class="section">Einkaufsliste</h2>'+
    '<div class="sub">Entsteht aus dem Wochenplan. Gleiche Zutaten werden '+
      'zusammengezählt – auch wenn sie in den Rezepten unterschiedlich heißen.</div>'+
    '<div class="card pad" style="margin-bottom:22px"><div class="row">'+
      '<span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;'+
      'color:var(--ink-faint)">Sortierung</span>'+
      modes.map(m=>'<button class="chip '+(mode===m[0]?'on':'')+'" data-s="'+m[0]+'">'+
        m[1]+'</button>').join('')+
      '<span class="spacer"></span>'+
      '<button class="btn sm" id="shopAdd">+ Eigener Posten</button>'+
      '<button class="btn sm" id="shopPrint">Drucken</button>'+
      '<button class="btn sm" id="shopCopy">Kopieren</button>'+
      '<button class="btn sm ghost" id="shopReset">Neue Liste starten</button>'+
    '</div></div>'+
    (all.length
      ? (open.length
          ? groups.map(g=>'<div class="shop-group"><h4>'+esc(g.label)+'</h4>'+
              g.items.map(it=>line(it,false)).join('')+'</div>').join('')
          : '<div class="empty"><p>Alles eingekauft.</p></div>')+
        (done.length
          ? '<div class="shop-done-head" id="doneHead">'+
              (doneOpen?'▾':'▸')+' Schon da ('+done.length+')</div>'+
            (doneOpen ? '<div class="shop-group">'+
              done.map(it=>line(it,true)).join('')+'</div>' : '')
          : '')
      : '<div class="empty"><p>Der Wochenplan ist noch leer.</p>'+
        '<button class="btn primary" id="goPlan">Zum Wochenplan</button></div>');

  $('#view').onclick = e => {
    const s2 = e.target.closest('[data-s]');
    if(s2){ S.settings.shopSort = s2.dataset.s; save(); viewShop(); return; }
    if(e.target.id==='goPlan'){ route='plan'; render(); return; }
    if(e.target.closest('#doneHead')){ doneOpen = !doneOpen; viewShop(); return; }
    if(e.target.id==='shopAdd'){ addExtraDialog(); return; }
    if(e.target.id==='shopReset'){
      if(!confirm('Haken entfernen und eigene Posten löschen?')) return;
      S.shopDone={}; S.shopExtra=[]; save(); viewShop(); return; }
    if(e.target.id==='shopPrint'){
      printShopping(groupShopping(open, mode)); return; }
    if(e.target.id==='shopCopy'){
      const txt = groups.map(g=>g.label+'\n'+
        g.items.map(i=>'- '+i.qty+' '+i.name).join('\n')).join('\n\n');
      copyText(txt, 'Einkaufsliste kopiert.');
    }
  };
  $('#view').onchange = e => { const c = e.target.closest('[data-k]'); if(!c) return;
    if(c.checked) S.shopDone[c.dataset.k]=1; else delete S.shopDone[c.dataset.k];
    save(); viewShop(); };
}

/* Vor dem Einspielen zeigen, was passiert: Was kommt neu dazu, was ist schon
   da? Erst danach entscheidet man zwischen Ergänzen und Ersetzen. */
function importChoice(payload){
  const liste = (payload && Array.isArray(payload.recipes))
    ? payload.recipes.map(normalizeRecipe) : [];
  if(!liste.length){ toast('In der Datei stehen keine Rezepte.'); return; }
  const vorhanden = {};
  S.recipes.forEach(r=> vorhanden[norm(r.title)] = true);
  const neu = [], dopp = [], gesehen = {};
  liste.forEach(r=>{
    const k = norm(r.title);
    if(vorhanden[k] || gesehen[k]) dopp.push(r.title); else { neu.push(r.title); gesehen[k]=true; }
  });
  const wann = payload.exportedAt ? new Date(payload.exportedAt).toLocaleDateString('de-DE') : '';
  const liste1 = (titel, klasse, ueberschrift) => !titel.length ? '' :
    '<div class="imp-box '+klasse+'"><h4>'+ueberschrift+' ('+titel.length+')</h4><ul>'+
      titel.slice(0,10).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>'+
      (titel.length>10 ? '<div class="mehr">und '+(titel.length-10)+' weitere</div>' : '')+
    '</div>';

  openModal('Backup einspielen',
    '<p class="imp-meta">'+liste.length+' Rezepte in der Sicherung'+
      (wann ? ' vom '+wann : '')+'. Dein Buch enthält gerade '+S.recipes.length+'.</p>'+
    liste1(neu, 'neu', 'Kommt neu dazu')+
    liste1(dopp, 'dop', 'Schon vorhanden – wird beim Zusammenführen übersprungen')+
    '<p class="hint" style="margin-top:14px"><b>Zusammenführen</b> ergänzt nur die '+
      'neuen Rezepte. Deine eigenen Fassungen gleichnamiger Rezepte bleiben, wie sie '+
      'sind – ebenso Wochenplan, Einkaufsliste und Einstellungen.<br>'+
      '<b>Alles ersetzen</b> überschreibt dein Buch vollständig, samt Wochenplan, '+
      'Einkaufsliste und Einstellungen aus der Sicherung.</p>',
    [(neu.length
        ? '<button class="btn primary" id="impMerge">'+neu.length+' hinzufügen</button>'
        : '<button class="btn" disabled>Nichts Neues dabei</button>'),
     '<button class="btn danger" id="impRepl">Alles ersetzen</button>',
     '<button class="btn ghost" id="impNo">Abbrechen</button>'],
    m => {
      m.querySelector('#impNo').onclick = closeModal;
      if(m.querySelector('#impMerge')) m.querySelector('#impMerge').onclick = () => {
        const n = mergeRecipes(liste);
        closeModal();
        toast(n+' Rezepte hinzugefügt'+(dopp.length ? ', '+dopp.length+' übersprungen.' : '.'));
      };
      m.querySelector('#impRepl').onclick = () => {
        if(!confirm('Dein Buch mit '+S.recipes.length+' Rezepten wird vollständig '+
          'durch die Sicherung ersetzt. Fortfahren?')) return;
        applyBackup(payload); closeModal();
      };
    });
}

/* Rezepte ergänzen, ohne das eigene Buch zu verlieren. Gleiche Titel bleiben,
   wie sie sind – niemand will seine Anpassungen überschrieben bekommen. */
function mergeRecipes(liste){
  const da = {};
  S.recipes.forEach(r=> da[norm(r.title)] = true);
  let n = 0;
  (liste||[]).forEach(r=>{
    if(!r || !r.title || da[norm(r.title)]) return;
    const kopie = normalizeRecipe(JSON.parse(JSON.stringify(r)));
    kopie.id = uid(); kopie.createdAt = Date.now();
    S.recipes.push(kopie); da[norm(r.title)] = true; n++;
  });
  if(n){ save(); render(); }
  return n;
}
function applyBackup(p){
  S = normalizeState(p);
  save(); render(); toast('Backup eingespielt.');
}

/* Ein Blatt Papier: die A5-Buchseite wird für A4 mittig vergrößert */
const paper = sheet => '<div class="paper '+S.settings.printFormat+'">'+sheet+'</div>';

/* Seitenfolge. Rezept vorne, Notizen hinten – daher immer paarweise, damit
   beim beidseitigen Druck nichts verrutscht. Leerseiten nur, wo physisch nötig. */
function buildPages(scope, oneId){
  const s = S.settings, pages = [], notes = s.printNotes;
  let list = S.recipes.slice();
  if(scope==='selection') list = list.filter(r=>selection.has(r.id));
  else if(oneId) list = list.filter(r=>r.id===oneId);
  else if(String(scope).startsWith('ch:')) list = list.filter(r=>r.chapter===scope.slice(3));

  /* Trennblätter sind Registerkarten und werden einseitig gedruckt */
  if(scope==='dividers') return CHAPTERS.map((c,i)=>sheetDivider(c,i));

  if(s.printCover && scope==='all'){
    pages.push(sheetCover());
    if(notes) pages.push(sheetBlank());   /* Rückseite des Titels bleibt frei */
  }
  CHAPTERS.forEach(c=>{
    list.filter(r=>r.chapter===c.id).forEach(r=>{
      pages.push(sheetRecipe(r, 1, yieldOf(r)));
      if(notes) pages.push(sheetNotes(r));
    });
  });
  return pages;
}

function doPrint(scope, oneId){
  const pages = buildPages(scope==='one' ? 'one' : scope, oneId);
  if(!pages.length){ toast('Dafür gibt es noch keine Rezepte.'); return; }
  printHint(()=>{
    const fmt = S.settings.printFormat;
    $('#pageStyle').textContent = '@page{size:'+(fmt==='a4'?'210mm 297mm':'148mm 210mm')+
      ';margin:0}';
    const root = $('#printRoot');
    root.innerHTML = pages.map(paper).join('');
    if(!S.settings.printMargin)
      root.querySelectorAll('.sheet').forEach(x=>x.style.padding='11mm 14mm 12mm');
    root.style.display='block';
    fitSheets(root);
    root.style.display='';
    setTimeout(()=>window.print(), 80);
  });
}

function backupPayload(){
  return Object.assign({ app:'rezeptbuch', version:DATA_VERSION,
    exportedAt:new Date().toISOString() }, S);
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(backupPayload(),null,2)],
    {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rezeptbuch-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup gespeichert.');
}
function importBackup(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const p = JSON.parse(rd.result);
      if(!p.recipes) throw new Error('kein Rezeptbuch');
      importChoice(p);
    }catch(err){ toast('Datei konnte nicht gelesen werden.'); }
  };
  rd.readAsText(f);
  e.target.value = '';          /* damit dieselbe Datei erneut gewählt werden kann */
}

/* Wo steht dieselbe Zutat unter verschiedenen Namen? */
function dupGroups(){
  const by = {};
  S.recipes.forEach(r => (r.ingredients||[]).forEach(i=>{
    if(!i.n) return;
    const k = canonical(i.n);
    (by[k] = by[k] || {})[i.n] = (by[k][i.n]||0) + 1;
  }));
  return Object.keys(by).map(k=>({ key:k, variants:Object.keys(by[k]), counts:by[k] }))
    .filter(g => g.variants.length > 1)
    .sort((a,b)=> b.variants.length - a.variants.length);
}
function dupDialog(){
  const groups = dupGroups();
  openModal('Schreibweisen angleichen',
    '<p class="hint" style="margin:0 0 16px">Wähl je Zeile die Schreibweise, die '+
      'überall stehen soll. Was du nicht auswählst, bleibt wie es ist.</p>'+
    groups.map((g,k)=>
      '<label class="field"><span>'+esc(g.variants.join('  ·  '))+'</span>'+
      '<select data-g="'+k+'"><option value="">— unverändert lassen —</option>'+
      g.variants.map(v=>'<option value="'+esc(v)+'">'+esc(v)+' ('+g.counts[v]+'×)</option>')
        .join('')+'</select></label>').join(''),
    ['<button class="btn primary" id="duOk">Anwenden</button>',
     '<button class="btn ghost" id="duNo">Abbrechen</button>'],
    m => {
      m.querySelector('#duNo').onclick = closeModal;
      m.querySelector('#duOk').onclick = () => {
        let n = 0;
        m.querySelectorAll('[data-g]').forEach(sel=>{
          const pick = sel.value; if(!pick) return;
          const g = groups[+sel.dataset.g];
          S.recipes.forEach(r => (r.ingredients||[]).forEach(i=>{
            if(i.n && canonical(i.n) === g.key && i.n !== pick){ i.n = pick; n++; }
          }));
        });
        save(); closeModal(); render();
        toast(n ? n+' Zutaten angeglichen.' : 'Nichts geändert.');
      };
    });
}

        : '<p class="hint" style="margin:0">Alle Zutaten sind einheitlich '+
          'geschrieben.</p>')+
    '</div>'+
    '<div class="card pad" style="max-width:520px;margin-top:18px">'+
      '<div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;'+
        'color:var(--ink-faint);margin-bottom:10px">Nährwerte</div>'+
      '<p class="hint" style="margin:0">Die Schätzung stützt sich auf eine Tabelle mit '+
        FOODS.length+' Zutaten. Sie liefert Richtwerte für die Portionsplanung, keine '+
        'exakte Analyse. Bei jedem Rezept lassen sich die Werte von Hand überschreiben.</p>'+
    '</div>';
  if($('#sDup')) $('#sDup').onclick = dupDialog;
  $('#sSave').onclick = () => {
    S.settings.title = $('#sT').value.trim() || 'Unser Rezeptbuch';
    S.settings.subtitle = $('#sS').value.trim();
    save(); render(); toast('Gespeichert.');
  };
}

window.APP = {
  get state(){ return S; },       set state(v){ S = v; },

  save, render, nutriOf, estimate, findFood, grams, deptOf, num,
  buildShopping, groupShopping, buildPages, mergeRecipes, importChoice, yieldOf, normalizeRecipe, normalizeState,
  applyBackup, backupPayload, parseRecipeText, parseOwnExport, pdfToText, fontNameMap, parseCMap, inflate, contentToText, tokenizeContent, itemsToLines, xyCut, stepMinutes, canonical,
  stepIngredients, startCooking, endCooking, preClassify, assignToRecipe, parseIngredient, tidy, parseExchange, parseAmount,
  openAssign
};

render();
