<title>Unser Rezeptbuch</title>
<style id="pageStyle">@page{size:210mm 297mm;margin:0}</style>
<style>
:root{
  --ink:#1f1d1a; --ink-soft:#66605a; --ink-faint:#9c948a;
  --rule:#d5cec4; --rule-soft:#e8e4dd; --paper:#fff;
  --bg:#f6f4f0; --accent:#8a6d3b; --accent-soft:#f0ead9;
  --danger:#a4442f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- Kopfleiste ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.01em;margin-right:auto}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--ink-soft);
  font-size:13.5px;letter-spacing:.01em}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent)}

/* ---------- Grundelemente ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
h2.section{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 4px}
.sub{color:var(--ink-faint);font-size:13px;margin-bottom:22px}

.btn{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 14px;
  font-size:13.5px;color:var(--ink)}
.btn:hover{border-color:var(--ink-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#755c31}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--paper);border-color:var(--rule)}
.btn.danger{color:var(--danger);border-color:#e6d2cc}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:5px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--paper);
  border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;line-height:1.5}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px}
.pad{padding:18px 20px}

.chip{background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:6px 13px;
  font-size:12.5px;color:var(--ink-soft)}
.chip.on{background:var(--accent-soft);border-color:#e0d3b4;color:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap}

.empty{text-align:center;color:var(--ink-faint);padding:60px 20px;font-size:14px}
.empty p{margin:0 0 16px}

/* ---------- Startseite ---------- */
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hero h2{font-family:var(--serif);font-weight:400;font-size:27px;margin:0;line-height:1}
.hero .count{font-size:12.5px;color:var(--ink-faint);margin-bottom:2px}
.hero .sp{flex:1}
.search{position:relative;margin-bottom:20px}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:12px;font-size:15px;
  border:1px solid var(--rule);background:var(--paper)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--ink-faint);fill:none;stroke-width:1.7}
.tabs{display:flex;gap:22px;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--rule-soft);padding-bottom:1px}
.tabs button{background:none;border:0;padding:9px 0;font-size:14px;color:var(--ink-soft);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .sp{flex:1}
.tabs .more{font-size:12.5px;color:var(--ink-faint)}
.filters{margin:16px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;
  margin-top:22px}
.rcard{background:var(--paper);border:1px solid transparent;border-radius:14px;
  padding:24px 18px 20px;text-align:center;cursor:pointer;position:relative;
  box-shadow:0 1px 2px rgba(31,29,26,.05);transition:box-shadow .15s, transform .15s}
.rcard:hover{box-shadow:0 6px 20px rgba(31,29,26,.10);transform:translateY(-2px)}
.rcard .ico{width:26px;height:26px;margin:0 auto 12px;display:block;opacity:.85}
.rcard .kind{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);
  margin-bottom:8px}
.rcard h3{font-family:var(--serif);font-weight:400;font-size:17.5px;margin:0;line-height:1.24}
.rcard .ft{margin-top:14px;font-size:11.5px;color:var(--ink-faint)}
.rcard .last{margin-top:6px;font-size:10.5px;color:var(--ink-faint);opacity:.8}
.rcard .sel{position:absolute;top:12px;left:12px;width:18px;height:18px;accent-color:var(--accent)}
.rcard.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* ---------- Vorratssuche ---------- */
.pantry-box{background:var(--paper);border:1px solid var(--rule);border-radius:12px;
  padding:18px 20px;margin-bottom:20px}
.pantry-in{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pantry-in input{flex:1;min-width:180px}
.pantry-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.pantry-chips .chip{background:var(--accent-soft);border-color:#e0d3b4;color:var(--accent)}
.pantry-chips .chip b{font-weight:400;margin-left:7px;opacity:.65}
.hit{background:var(--paper);border:1px solid var(--rule);border-radius:12px;
  padding:16px 18px;margin-bottom:11px;display:flex;gap:16px;align-items:flex-start}
.hit .ic{flex:none;margin-top:2px}
.hit .mid{flex:1;min-width:0}
.hit h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 5px}
.hit .sc{font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.hit .miss{font-size:12.5px;color:var(--ink-faint)}
.hit .miss b{font-weight:400;color:var(--danger)}
.hit .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.bar{height:5px;border-radius:3px;background:var(--rule-soft);overflow:hidden;
  margin:7px 0 9px;max-width:220px}
.bar i{display:block;height:100%;background:var(--accent)}

/* ---------- Backup einspielen ---------- */
.imp-box{border:1px solid var(--rule-soft);border-radius:10px;padding:13px 15px;
  margin-bottom:12px}
.imp-box h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500}
.imp-box.neu h4{color:var(--accent)}
.imp-box ul{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:1.65}
.imp-box li{color:var(--ink-soft)}
.imp-box.dop li{text-decoration:line-through;color:var(--ink-faint)}
.imp-box .mehr{font-size:12.5px;color:var(--ink-faint);margin-top:5px}
.imp-meta{font-size:12.5px;color:var(--ink-faint);margin:0 0 16px}

/* ---------- Zuordnen beim Import ---------- */
.asg-head{position:sticky;top:0;background:var(--paper);z-index:2;padding-bottom:12px;
  border-bottom:1px solid var(--rule-soft);margin-bottom:6px}
.asg-sum{font-size:12.5px;color:var(--ink-soft);margin-top:9px}
.asg-sum b{font-weight:400;color:var(--accent)}
.asg-row{display:flex;gap:12px;align-items:flex-start;padding:7px 0;
  border-bottom:1px solid var(--rule-soft)}
.asg-roles{display:flex;flex:none;border:1px solid var(--rule);border-radius:8px;
  overflow:hidden}
.asg-roles button{background:var(--paper);border:0;border-right:1px solid var(--rule);
  padding:6px 9px;font-size:11px;color:var(--ink-faint);min-width:34px}
.asg-roles button:last-child{border-right:0}
.asg-roles button.on{background:var(--accent);color:#fff}
.asg-txt{flex:1;font-size:14px;line-height:1.4;padding-top:5px;word-break:break-word}
.asg-row.x .asg-txt{color:var(--ink-faint);text-decoration:line-through}
.asg-row.t .asg-txt{font-family:var(--serif);font-size:18px}
.asg-from{flex:none;padding-top:5px}
.asg-from button{background:none;border:0;color:var(--ink-faint);font-size:11px;
  padding:4px 6px;white-space:nowrap}
.asg-from button:hover{color:var(--accent)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(35,32,28,.45);z-index:60;display:flex;
  align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal{background:var(--paper);border-radius:14px;width:100%;max-width:860px;position:relative}
.modal.narrow{max-width:560px}
.modal-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--rule)}
.modal-head h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;flex:1}
.modal-body{padding:22px}
.modal-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--rule);
  background:#fbfaf8;border-radius:0 0 14px 14px}

/* ---------- Zutaten-Editor ---------- */
.ing-row{display:grid;grid-template-columns:78px 92px 1fr 34px;gap:8px;margin-bottom:7px}
.step-row{display:grid;grid-template-columns:24px 1fr 34px;gap:8px;margin-bottom:8px;align-items:start}
.step-row .no{font-size:12px;color:var(--accent);padding-top:11px;text-align:center}
.icon-btn{background:none;border:0;color:var(--ink-faint);font-size:17px;line-height:1;padding:8px}
.icon-btn:hover{color:var(--danger)}

.nutri-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule-soft);border-radius:8px;overflow:hidden;margin-top:6px}
.nutri-preview div{background:var(--paper);padding:11px 8px;text-align:center}
.nutri-preview b{display:block;font-size:16px;font-weight:400;font-family:var(--serif)}
.nutri-preview span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.hint{font-size:12px;color:var(--ink-faint);margin:6px 0 0;line-height:1.45}
.warn{background:#fdf6ec;border:1px solid #ecd9b6;border-radius:8px;padding:10px 12px;
  font-size:12.5px;color:#7a5c22;margin-top:10px}

/* ---------- Wochenplan ---------- */
.plan{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 11px}
.day h4{margin:0 0 3px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.day .pers{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-faint);
  margin-bottom:11px}
.day .pers input{width:44px;padding:3px 5px;font-size:12px;text-align:center;border-radius:6px}
.slot{margin-bottom:9px}
.slot .sl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
  margin-bottom:3px}
.slot select{padding:6px 7px;font-size:12.5px;border-radius:7px}
@media(max-width:900px){.plan{grid-template-columns:repeat(2,1fr)}}

/* ---------- Einkaufsliste ---------- */
.shop-group{margin-bottom:24px}
.shop-group h4{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
  margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.shop-item{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--rule-soft)}
.shop-item input{margin-top:2px}
.shop-item .q{width:88px;flex:none;color:var(--ink-soft);font-size:13.5px}
.shop-item .n{flex:1}
.shop-item.done .n,.shop-item.done .q{color:var(--ink-faint);text-decoration:line-through}
.shop-item .from{font-size:11px;color:var(--ink-faint)}

/* ---------- Rezeptansicht am Bildschirm ---------- */
.rv-head{text-align:center;padding:6px 0 20px;border-bottom:1px solid var(--rule-soft);
  margin-bottom:20px}
.rv-head .ico{display:block;margin:0 auto 10px}
.rv-kind{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);
  margin-bottom:8px}
.rv-head h2{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.14;margin:0 0 10px}
.rv-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rv-tags span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);background:var(--bg);border-radius:999px;padding:4px 11px}
.rv-meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.rv-meta div{flex:1;min-width:88px;text-align:center;background:var(--bg);border-radius:10px;
  padding:11px 8px}
.rv-meta dt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
  margin:0 0 4px}
.rv-meta dd{margin:0;font-size:14.5px}
.rv-cols{display:flex;gap:30px;align-items:flex-start}
.rv-ing{width:250px;flex:none}
.rv-steps{flex:1}
.rv-h{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
  margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule-soft)}
.rv-ing ul{list-style:none;margin:0;padding:0}
.rv-ing li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--rule-soft);
  font-size:14.5px}
.rv-ing li:last-child{border-bottom:0}
.rv-ing .a{width:74px;flex:none;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rv-steps ol{list-style:none;margin:0;padding:0;counter-reset:rs}
.rv-steps li{counter-increment:rs;position:relative;padding-left:34px;margin-bottom:16px;
  font-size:15px;line-height:1.55}
.rv-steps li::before{content:counter(rs);position:absolute;left:0;top:1px;width:23px;height:23px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;
  display:flex;align-items:center;justify-content:center}
.rv-tip{margin-top:18px;padding:13px 15px;background:var(--bg);border-radius:10px;
  font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-soft);line-height:1.5}
.rv-nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden;margin:24px 0 0}
.rv-nutri div{background:var(--paper);padding:13px 8px;text-align:center}
.rv-nutri b{display:block;font-family:var(--serif);font-size:19px;font-weight:400}
.rv-nutri span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.rv-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  padding-bottom:18px;margin-bottom:4px}
.rv-log{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule-soft)}
.rv-log .e{display:flex;gap:12px;font-size:13.5px;padding:7px 0;color:var(--ink-soft);
  border-bottom:1px dotted var(--rule-soft)}
.rv-log .e b{font-weight:400;color:var(--ink);min-width:86px}
.rv-log .e .ea{display:flex;gap:2px;opacity:.45;transition:opacity .12s}
.rv-log .e:hover .ea{opacity:1}
.rv-log .e .icon-btn{padding:2px 6px;font-size:14px}
@media(hover:none){ .rv-log .e .ea{opacity:1} }
.btn.big{padding:12px 20px;font-size:15px;border-radius:10px}

/* ---------- Kochmodus ---------- */
#cookRoot{position:fixed;inset:0;z-index:120;background:var(--paper);display:none;
  flex-direction:column;overscroll-behavior:contain}
#cookRoot.on{display:flex}
.ck-top{display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid var(--rule-soft);flex:none}
.ck-top .t{flex:1;font-family:var(--serif);font-size:17px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-top .x{background:none;border:0;font-size:15px;color:var(--ink-soft);padding:6px 4px}
.ck-bar{height:3px;background:var(--rule-soft);flex:none}
.ck-bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.ck-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:34px 24px 24px;display:flex;justify-content:center}
.ck-inner{width:100%;max-width:660px}
.ck-label{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);
  text-align:center;margin-bottom:20px}
.ck-inner h3{font-family:var(--serif);font-weight:400;font-size:26px;text-align:center;
  margin:0 0 26px;line-height:1.2}
.ck-step{font-family:var(--serif);font-size:25px;line-height:1.48;margin:0}
.ck-hint{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule-soft);
  font-size:13.5px;color:var(--ink-soft)}
.ck-hint .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
  display:block;margin-bottom:7px}
.ck-hint .i{display:inline-block;background:var(--bg);border-radius:999px;padding:5px 12px;
  margin:0 6px 6px 0;font-size:13.5px}
.ck-check{list-style:none;margin:0;padding:0}
.ck-check li{border-bottom:1px solid var(--rule-soft)}
.ck-check label{display:flex;gap:14px;align-items:center;padding:14px 4px;cursor:pointer;
  font-size:17px}
.ck-check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.ck-check .a{width:96px;flex:none;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ck-check li.done label{color:var(--ink-faint)}
.ck-check li.done .n{text-decoration:line-through}
.ck-foot{flex:none;display:flex;gap:12px;align-items:center;padding:16px 20px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule-soft);background:var(--paper)}
.ck-foot .btn{flex:1;padding:16px;font-size:16px;border-radius:12px}
.ck-foot .btn.primary{flex:2}
.ck-timer{display:inline-flex;align-items:center;gap:9px;background:var(--accent-soft);
  color:var(--accent);border:0;border-radius:999px;padding:9px 16px;font-size:14px;
  margin-top:18px}
.ck-timer.run{background:var(--accent);color:#fff}
.ck-done{text-align:center;padding:20px 0}
.ck-done .big{font-family:var(--serif);font-size:30px;margin:18px 0 10px}
@media(max-width:760px){
  .rv-cols{flex-direction:column;gap:24px}
  .rv-ing{width:100%}
  .rv-head h2{font-size:24px}
  .rv-meta div{min-width:70px;padding:9px 6px}
  .rv-meta dd{font-size:13.5px}
  .rv-actions{position:sticky;top:56px;background:var(--paper);z-index:3;padding-top:8px}
  .rv-actions .btn{flex:1}
  .ck-body{padding:26px 18px 18px}
  .ck-step{font-size:22px}
  .ck-inner h3{font-size:22px}
}

/* ---------- Export ---------- */
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 0}
.opt label{font-size:14px}
.opt .d{font-size:12px;color:var(--ink-faint);margin-top:2px}

/* ================= DRUCKLAYOUT (A5-Buchseiten) ================= */
#printRoot{display:none}
.sheet{position:relative;width:148mm;height:210mm;background:#fff;overflow:hidden;
  display:flex;flex-direction:column;font-family:var(--serif);color:var(--ink)}
.sheet.front{padding:11mm 12mm 12mm 18mm}
.sheet.back{padding:11mm 18mm 12mm 12mm}
.sheet .head{text-align:center;flex:none}
.sheet .bicon{display:block;margin:0 auto 2mm}
.sheet .kind{font-family:var(--sans);font-size:6.2pt;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:3.5mm}
.sheet h1{font-family:var(--serif);font-size:22pt;font-weight:400;line-height:1.12;margin:0 0 2.5mm}
.sheet .tags{font-family:var(--sans);font-size:6.6pt;letter-spacing:.16em;color:var(--ink-soft);
  text-transform:uppercase}
.sheet .tags .sep{color:var(--rule);margin:0 1.4mm}
.sheet hr.rule{border:0;border-top:.4pt solid var(--rule);margin:4.5mm 0;flex:none}
.sheet .meta{display:flex;justify-content:space-between;text-align:center;font-family:var(--sans);
  margin-bottom:5.5mm;flex:none}
.sheet .meta > div{flex:1}
.sheet .meta dt{font-size:5.7pt;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
  margin:0 0 1.4mm}
.sheet .meta dd{font-size:8pt;margin:0}
.sheet h2{font-family:var(--sans);font-size:6.4pt;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 3mm;padding-bottom:1.5mm;
  border-bottom:.4pt solid var(--rule-soft)}
.sheet .body-grid{display:flex;gap:7mm;flex:1 1 auto;min-height:0}
.sheet .col-left{width:47mm;flex:none;display:flex;flex-direction:column}
.sheet .col-right{flex:1}
.sheet .ingredients{list-style:none;margin:0;padding:0;font-size:8.8pt}
/* Lange Listen brauchen weniger Luft, sonst passt die Seite nicht */
.sheet .col-left.dense .ingredients{font-size:7.6pt}
.sheet .col-left.dense .ingredients li{padding:.6mm 0;line-height:1.25}
.sheet .col-right.dense .steps{font-size:7.9pt}
.sheet .col-right.dense .steps li{margin-bottom:1.9mm;line-height:1.34}
.sheet .col-right.dense .tip{font-size:7pt;margin-top:2.5mm;padding-top:2mm}
.sheet .ingredients li{display:flex;gap:2mm;line-height:1.34;padding:1mm 0;
  border-bottom:.3pt dotted var(--rule-soft)}
.sheet .ingredients li:last-child{border-bottom:0}
.sheet .amount{width:16mm;flex:none;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sheet .steps{margin:0;padding:0;list-style:none;counter-reset:s;font-size:8.8pt}
.sheet .steps li{counter-increment:s;position:relative;padding-left:6mm;margin-bottom:2.6mm;
  line-height:1.42}
.sheet .steps li::before{content:counter(s);position:absolute;left:0;top:.4mm;
  font-family:var(--sans);font-size:6.6pt;color:var(--accent)}
.sheet .tip{margin:3.5mm 0 0;padding-top:2.5mm;border-top:.4pt solid var(--rule-soft);
  font-size:7.6pt;font-style:italic;color:var(--ink-soft);line-height:1.4}
.sheet .nutri{flex:none;margin-top:auto;font-family:var(--sans);border:.4pt solid var(--rule);
  padding:3mm 3.5mm 2.5mm}
.sheet .nutri-label{font-size:5.5pt;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);text-align:center;padding-bottom:2mm;margin-bottom:1mm;
  border-bottom:.3pt solid var(--rule-soft)}
.sheet .nutri-row{display:flex;justify-content:space-between;align-items:baseline;padding:1.1mm 0;
  border-bottom:.3pt dotted var(--rule-soft)}
.sheet .nutri-row:last-child{border-bottom:0;padding-bottom:0}
.sheet .nutri-key{font-size:6pt;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.sheet .nutri-val{font-size:8.6pt;font-variant-numeric:tabular-nums}
.sheet .note-head{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:.4pt solid var(--rule);padding-bottom:2.5mm;margin-bottom:7mm;flex:none}
.sheet .note-head .t{font-family:var(--sans);font-size:6.4pt;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-soft)}
.sheet .note-head .r{font-size:9.5pt;font-style:italic;color:var(--ink-soft)}
.sheet .from{display:flex;align-items:baseline;gap:2mm;flex:none;margin-bottom:7mm}
.sheet .from .lbl{font-family:var(--sans);font-size:6.2pt;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.sheet .from .fill{flex:1;border-bottom:.3pt solid var(--rule-soft);height:6mm}
.sheet table.cooked{width:100%;border-collapse:collapse;margin-bottom:9mm;flex:none}
.sheet table.cooked th{font-family:var(--sans);font-size:5.7pt;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:400;text-align:left;
  padding:0 1.5mm 1.5mm;border-bottom:.4pt solid var(--rule)}
.sheet table.cooked td{height:8.5mm;border-bottom:.3pt solid var(--rule-soft);padding:0 1.5mm}
.sheet table.cooked .c-date{width:20mm}
.sheet table.cooked .c-guest{width:14mm}
.sheet table.cooked .c-rate{width:24mm;text-align:center}
.sheet table.cooked td.c-rate{color:var(--rule);font-size:7.5pt;letter-spacing:.35mm;white-space:nowrap}
.sheet .lines div{height:8.2mm;border-bottom:.3pt solid var(--rule-soft)}
.sheet.cover,.sheet.divider{justify-content:center;align-items:center;text-align:center}
.sheet.cover h1{font-size:30pt;margin-bottom:4mm}
.sheet.cover .frame{border:.5pt solid var(--rule);padding:18mm 10mm;width:100%}
.sheet .dash{width:18mm;border-top:.5pt solid var(--accent);margin:7mm auto}
.sheet.cover .sub{font-family:var(--sans);font-size:7pt;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-faint)}
.sheet.divider h1{font-size:26pt;margin:6mm 0 0}
.sheet.divider .dash{width:22mm;margin:6mm auto 0}
.sheet .tab{position:absolute;right:0;width:9mm;height:40mm;border:.4pt solid var(--rule);
  border-right:0;background:#fff}
.sheet .tab span{position:absolute;left:50%;top:50%;width:40mm;margin-left:-20mm;margin-top:-2mm;
  transform:rotate(90deg);text-align:center;font-family:var(--sans);font-size:6.4pt;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
/* Einkaufsliste im Druck */
.sheet.list{padding:14mm}
.sheet.list h1{font-size:18pt;text-align:center;margin-bottom:2mm}
.sheet.list .when{font-family:var(--sans);font-size:6.4pt;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);text-align:center;margin-bottom:7mm}
.sheet.list .g{font-family:var(--sans);font-size:6.2pt;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);margin:5mm 0 2mm;padding-bottom:1.2mm;border-bottom:.4pt solid var(--rule)}
.sheet.list .it{display:flex;gap:2mm;font-size:8.6pt;padding:1.2mm 0;
  border-bottom:.3pt dotted var(--rule-soft)}
.sheet.list .it .box{width:3mm;height:3mm;border:.4pt solid var(--rule);flex:none;margin-top:1mm}
.sheet.list .it .q{width:20mm;flex:none;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* Blatt = physisches Papier. Die A5-Buchseite wird darin zentriert und
   für A4 vergrößert, damit das Layout exakt gleich bleibt. */
.paper{position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:#fff;flex:none}
.paper.a4{width:210mm;height:297mm}
/* zoom vergrößert das Layout selbst (nicht nur die Darstellung) – dadurch
   druckt A4 exakt so wie die Vorschau. */
.paper.a4 > .sheet{zoom:1.38}
@supports not (zoom:1){
  .paper.a4 > .sheet{zoom:normal;transform:scale(1.38);transform-origin:center center}
}
.paper.a5{width:148mm;height:210mm}

/* Bildschirmvorschau der Buchseiten */
.preview{background:#c9c5bf;padding:20px;border-radius:12px;display:flex;flex-wrap:wrap;gap:14px;
  justify-content:center}
.preview .paper{box-shadow:0 2px 14px rgba(0,0,0,.25)}
.pv-scale{overflow:hidden;flex:none}
.pv-scale > *{transform-origin:top left}
.pv-a4{width:105mm;height:148.5mm}
.pv-a4 > *{transform:scale(.5)}
.pv-a5{width:111mm;height:157.5mm}
.pv-a5 > *{transform:scale(.75)}

@media print{
  html,body{background:#fff;margin:0;padding:0}
  .app,.topbar,.overlay,#toast{display:none !important}
  #printRoot{display:block !important}
  #printRoot .paper{page-break-after:always;break-after:page;box-shadow:none;margin:0}
  #printRoot .paper:last-child{page-break-after:auto;break-after:auto}
}

/* ---------- Handy und Tablet ---------- */
@media(max-width:760px){
  body{font-size:15.5px}
  .topbar-in{padding:11px 14px;gap:10px}
  .brand{font-size:17px;margin-right:0;width:100%}
  nav{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
    padding-bottom:2px}
  nav button{white-space:nowrap;padding:8px 12px}
  .wrap{padding:18px 14px 90px}
  h2.section{font-size:21px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
  .rcard{padding:16px 12px}
  .rcard h3{font-size:15.5px}
  .toolbar input[type=text]{width:100%}
  .toolbar .btn{flex:1}
  .overlay{padding:0}
  .modal{border-radius:0;max-width:none;min-height:100vh}
  .modal-head{position:sticky;top:0;background:var(--paper);z-index:2}
  .modal-foot{position:sticky;bottom:0}
  .modal-body{padding:16px}
  .ing-row{grid-template-columns:62px 84px 1fr 28px;gap:6px}
  .ing-row input,.ing-row select{padding:8px 7px;font-size:13.5px}
  .plan{grid-template-columns:1fr}
  .preview{padding:10px}
  .pv-a4,.pv-a5{width:78mm;height:110mm}
  .pv-a4 > *{transform:scale(.371)}
  .pv-a5 > *{transform:scale(.527)}
}
</style>

/* Brüche schön schreiben: 0.5 -> ½, 1.5 -> 1½ */
const FRAC = {'.25':'¼','.5':'½','.75':'¾','.33':'⅓','.67':'⅔'};
function num(n){
  if(n==null || isNaN(n)) return '';
  const neg = n<0; n = Math.abs(n);
  const whole = Math.floor(n+1e-9), rest = +(n-whole).toFixed(2);
  let f = FRAC[String(rest).replace(/^0/,'')];
  let out;
  if(f) out = (whole?whole:'') + f;
  else if(Math.abs(n-Math.round(n))<0.05) out = String(Math.round(n));
  else out = String(+n.toFixed(1)).replace('.',',');
  return (neg?'-':'') + out;
}

/* Ein Rezept aus fremder Quelle kann Felder vermissen – aus einer älteren
   Fassung der App, aus einem alten Backup, aus einem halben Import. Hier wird
   jedes Rezept auf einen vollständigen Stand gebracht. */
function normalizeRecipe(r){
  const b = blankRecipe();
  const out = Object.assign(b, r || {});
  out.id = out.id || uid();
  out.title = String(out.title || 'Ohne Titel');
  if(!CHAPTERS.some(c=>c.id===out.chapter)) out.chapter = 'hauptspeise';
  out.tags = Array.isArray(out.tags) ? out.tags.slice(0, MAX_TAGS) : [];
  out.servings = (+out.servings > 0) ? +out.servings : 4;
  out.servingsLabel = out.servingsLabel || 'Portionen';
  out.ingredients = Array.isArray(out.ingredients) && out.ingredients.length
    ? out.ingredients.map(i=>({ a:(i && i.a != null && !isNaN(+i.a)) ? +i.a : null,
        u:(i && i.u) || 'g', n:String((i && i.n) || '') })).filter(i=>i.n)
    : [];
  if(!out.ingredients.length) out.ingredients = [{a:null,u:'g',n:''}];
  out.steps = Array.isArray(out.steps) ? out.steps.map(x=>String(x||'')).filter(Boolean) : [];
  if(!out.steps.length) out.steps = [''];
  out.log = Array.isArray(out.log) ? out.log : [];
  out.tip = String(out.tip || '');
  if(out.nutriManual && typeof out.nutriManual !== 'object') out.nutriManual = null;
  return out;
}
function normalizeState(p){
  const st = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), p || {});

  st.recipes = Array.isArray(p && p.recipes) ? p.recipes.map(normalizeRecipe) : [];

}

   zum Selberkopieren an, statt kommentarlos nichts zu tun. */
function copyText(text, okMsg, fallbackField){
  const zeigen = () => {
    if(fallbackField){ fallbackField.value = text; fallbackField.focus();
      fallbackField.select(); toast('Bitte von Hand kopieren – Text ist markiert.'); }
    else toast('Kopieren ist in diesem Browser nicht erlaubt.');
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(()=>toast(okMsg), zeigen);
    else zeigen();
  }catch(e){ zeigen(); }

function toast(msg){

  if(!t){ t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);'+
      'background:#1f1d1a;color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;'+
      'z-index:200;box-shadow:0 4px 18px rgba(0,0,0,.25)';

  clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.opacity='0'; }, 2600);
}

/* Was praktisch immer im Haus ist – zählt bei der Vorratssuche nicht als „fehlt“ */
const STAPLES = ['salz','pfeff','öl','olivenöl','essig','zuck','mehl','wass','butt',
  'paprikapulv','oregano','zimt','curry','kreuzkümmel','chiliflock','cayenne','muskat',
  'backpulv','speisestärk','honig','senf','sojasauc'];
const isStaple = key => STAPLES.includes(key) ||
  STAPLES.some(x => key === x || key.endsWith(' '+x));

/* ------------------------ Nährwertschätzung ----------------------------- */
const norm = s => String(s||'').toLowerCase().replace(/[.,()]/g,' ').replace(/\s+/g,' ').trim();

/* Ein und dieselbe Zutat wird unterschiedlich geschrieben: „Tomaten“,
   „reife Tomaten“, „Tomaten, gewürfelt“. Für Einkaufsliste und Vorratssuche
   brauchen wir daraus einen gemeinsamen Schlüssel. */
const FILLER = new Set(['frisch','frische','frischer','frisches','reif','reife','reifer',
  'reifes','gehackt','gehackte','gehackter','fein','feine','feiner','klein','kleine',
  'gross','grosse','groß','große','gewürfelt','gewürfelte','getrocknet','getrocknete',
  'gemahlen','gemahlene','gemahlener','gerieben','geriebene','geriebener','bio','ca',
  'etwa','optional','zum','und','oder','nach','belieben','stück','stücke','davon',
  'gewaschen','geschält','geputzt','weich','hart','warm','kalt','mittelgroß']);
const SYNONYM = { 'eier':'ei','möhre':'karotte','möhren':'karotte','mohrrübe':'karotte',
  'rahm':'sahne','obers':'sahne','erdapfel':'kartoffel','erdäpfel':'kartoffel',
  'paradeiser':'tomate','germ':'hefe','topfen':'quark','fisolen':'bohne' };
function stem(w){
  if(SYNONYM[w]) w = SYNONYM[w];
  if(w.length > 4) w = w.replace(/(chen|lein|en|er|n|e|s)$/,'');
  return w;
}
function canonical(name){
  const base = norm(String(name||'').replace(/\([^)]*\)/g,' ').split(',')[0]);
  const words = base.split(' ').filter(w => w && !FILLER.has(w));
  const out = words.map(stem).filter(Boolean);
  return out.length ? out.join(' ') : base;
}
function findFood(name){
  const n = norm(name); let best=null, len=0;
  for(const f of FOODS){ if(n.includes(f[0]) && f[0].length>len){ best=f; len=f[0].length; } }
  return best;
}
/* Menge einer Zutat in Gramm — nutzt Stück-/EL-Gewichte aus der Tabelle */
function grams(ing){
  if(ing.a==null || ing.u==='n. B.') return 0;
  const f = findFood(ing.n), d = unitDef(ing.u);
  if(ing.u==='Stück')   return ing.a * ((f && f[6]) || 100);
  if(ing.u==='EL')      return ing.a * ((f && f[7]) || 15);
  if(ing.u==='TL')      return ing.a * ((f && f[7]) ? f[7]/3 : 5);
  if(ing.u==='Scheibe') return ing.a * ((f && f[6]) || 25);
  return ing.a * (d.g==null ? 100 : d.g);
}
function estimate(r){
  let k=0,p=0,fa=0,c=0; const unknown=[];
  for(const ing of (r.ingredients||[])){
    if(!ing.n) continue;
    const f = findFood(ing.n);
    if(!f){ if(ing.a!=null && ing.u!=='n. B.') unknown.push(ing.n); continue; }
    const g = grams(ing)/100;
    k += f[1]*g; p += f[2]*g; fa += f[3]*g; c += f[4]*g;
  }
  const per = v => v / yieldOf(r);
  return { kcal:Math.round(per(k)/5)*5, protein:Math.round(per(p)),
           fat:Math.round(per(fa)), carbs:Math.round(per(c)), unknown };
}
const nutriOf = r => r.nutriManual || estimate(r);
/* Nicht jedes Rezept ergibt vier Portionen: ein Brot, sechs Taschen, eine Bowl. */
const yieldOf = r => (r && +r.servings > 0) ? +r.servings : 4;
const yieldLabel = r => (r && r.servingsLabel) ? r.servingsLabel : 'Portionen';
function deptOf(name){ const f=findFood(name); return f ? f[5] : 'son'; }

function ingLine(ing, factor){

  const u = (ing.u==='n. B.') ? 'n. B.'

  const amt = (a + ' ' + u).trim();
  return '<li><span class="amount">'+esc(amt)+'</span><span>'+esc(ing.n)+'</span></li>';
}

/* Automatische Schriftanpassung + Umbruch auf eine zweite Seite */
function fitSheets(root){
  root.querySelectorAll('.sheet[data-fit]').forEach(sheet=>{
    const grid = sheet.querySelector('.body-grid');
    const right = sheet.querySelector('.col-right');
    if(!grid || !right) return;
    const sizes = [8.8, 8.4, 8.0, 7.6, 7.3];
    const steps = right.querySelector('.steps');
    const tip   = right.querySelector('.tip');
    /* Lange Zutatenlisten sprengen sonst die linke Spalte */
    const left = sheet.querySelector('.col-left');
    const ings = sheet.querySelector('.ingredients');
    if(left && ings){
      let k = 0;
      while(left.scrollHeight > grid.clientHeight + 1 && k < sizes.length-1){
        k++;
        ings.style.fontSize = sizes[k]+'pt';
        ings.querySelectorAll('li').forEach(li=>{
          li.style.padding = (1 - k*0.12)+'mm 0';
          li.style.lineHeight = '1.28';
        });
      }
    }
    let i = 0;
    const over = () => right.scrollHeight > grid.clientHeight + 1;
    while(over() && i < sizes.length-1){
      i++;
      if(steps) steps.style.fontSize = sizes[i]+'pt';
      if(tip)   tip.style.fontSize   = (sizes[i]-1.2)+'pt';
    }
    if(!over() || !steps) return;
    /* Passt immer noch nicht: restliche Schritte auf eine Folgeseite */
    const lis = Array.from(steps.children);
    const limit = grid.clientHeight - (tip ? tip.offsetHeight + 14 : 0);
    let cut = lis.length;
    for(let k=0;k<lis.length;k++){
      if(lis[k].offsetTop + lis[k].offsetHeight > limit){ cut = k; break; }
    }
    if(cut < 1 || cut >= lis.length) return;
    const rest = lis.slice(cut);
    rest.forEach(li=>li.remove());
    const cont = document.createElement('section');
    cont.className = 'sheet front';
    cont.innerHTML =
      '<div class="note-head"><span class="t">Fortsetzung</span>'+
      '<span class="r">'+sheet.querySelector('h1').textContent+'</span></div>'+
      '<ol class="steps" start="'+(cut+1)+'" style="counter-reset:s '+cut+
      ';font-size:'+sizes[i]+'pt">'+rest.map(li=>li.outerHTML).join('')+'</ol>'+
      (tip ? '<p class="tip">'+tip.innerHTML+'</p>' : '');
    if(tip) tip.remove();
    sheet.after(cont);
  });
}

        (r.tip ? '<div class="rv-tip">'+esc(r.tip)+'</div>' : '')+

}
/* Auswahl passend zur Grundmenge: aus 6 Taschen werden 3, 6, 12 – nicht 2, 4, 8 */
function portionChoices(r){
  const base = yieldOf(r);
  const set = [base/2, base, base*1.5, base*2]
    .map(v => Math.round(v*100)/100)
    .filter(v => v > 0);
  return set.filter((v,i)=> set.indexOf(v) === i);
}
function amountText(i, f){
  if(i.a==null) return i.u==='n. B.' ? 'n. B.' : '';
  const a = i.a*(f||1);
  return (num(a)+' '+(i.u==='Stück' ? '' : unitLabel(i.u,a))).trim();
}

    portionChoices(r).map(p=>'<button class="chip '+(detailServings===p?'on':'')+
      '" data-p="'+p+'">'+num(p)+'</button>').join('')+

function logHTML(r){

/* Kochen nachtragen oder einen bestehenden Eintrag ändern */
const deToIso = d => { const p = String(d||'').split('.');
  return p.length===3 ? p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0') : ''; };
function logDialog(r, idx){
  const editing = idx >= 0;
  const e = editing ? r.log[idx] : null;
  const heute = editing ? (deToIso(e.date) || new Date().toISOString().slice(0,10))
                        : new Date().toISOString().slice(0,10);

    '<div class="row" style="gap:12px">'+
      '<label class="field" style="flex:1;min-width:150px"><span>Datum</span>'+
        '<input type="date" id="lgDate" value="'+heute+'"></label>'+
      '<label class="field" style="width:110px"><span>Gäste</span>'+
        '<input type="number" id="lgGuests" min="0" value="'+
        (editing ? (e.guests||0) : 4)+'"></label></div>'+
    '<label class="field"><span>Anlass</span>'+
      '<input type="text" id="lgOcc" value="'+(editing ? esc(e.occasion||'') : '')+
      '" placeholder="Sonntagessen, Geburtstag …"></label>'+
    '<label class="field"><span>Bewertung</span><select id="lgRate">'+
      [5,4,3,2,1].map(v=>'<option value="'+v+'" '+
        (editing && e.rating===v ? 'selected' : (!editing && v===5 ? 'selected':''))+
        '>'+'★'.repeat(v)+'</option>').join('')+
    '</select></label>'+
    '<p class="hint">Der Eintrag steht danach im Rezept und wird auf der Notizseite '+
      'mitgedruckt.</p>',
    [editing ? '<button class="btn primary" id="lgOk">Änderung sichern</button>'
             : '<button class="btn primary" id="lgOk">Eintragen</button>',
     '<button class="btn ghost" id="lgNo">Abbrechen</button>'],
    m => {
      m.querySelector('#lgNo').onclick = () => { closeModal(); showRecipe(r.id); };
      m.querySelector('#lgOk').onclick = () => {
        const d = m.querySelector('#lgDate').value;
        const entry = {
          date: d ? d.split('-').reverse().join('.') :
                    new Date().toLocaleDateString('de-DE'),
          occasion: m.querySelector('#lgOcc').value.trim(),
          guests: +m.querySelector('#lgGuests').value || 0,
          rating: +m.querySelector('#lgRate').value || 0 };

          return k(a).localeCompare(k(b));

}

/* =========================================================================
   Kochmodus — erst herrichten, dann Schritt für Schritt
   ========================================================================= */
let cook = null;      /* {recipe, servings, page, checked:Set, wake, timer} */

async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !cook.wake)
      cook.wake = await navigator.wakeLock.request('screen');
    if(!on && cook && cook.wake){ cook.wake.release(); cook.wake = null; }
  }catch(e){ /* nicht überall verfügbar – dann bleibt es beim normalen Verhalten */ }
}
function startCooking(id){
  const r = S.recipes.find(x=>x.id===id); if(!r) return;
  cook = { r:r, servings:detailServings||yieldOf(r), page:0, checked:new Set(),
           wake:null, timer:null };
  $('#cookRoot').classList.add('on');
  document.body.style.overflow = 'hidden';
  keepAwake(true);
  drawCook();
}
function endCooking(){
  if(cook && cook.timer) clearInterval(cook.timer.h);
  keepAwake(false);
  $('#cookRoot').classList.remove('on');
  $('#cookRoot').innerHTML = '';
  document.body.style.overflow = '';
  cook = null;
}
/* Welche Zutaten kommen in diesem Schritt vor? */
function stepIngredients(step, r){
  const t = norm(step);
  return (r.ingredients||[]).filter(i=>{
    const w = norm(i.n).split(' ').filter(x=>x.length>3);
    return w.some(x=> t.includes(x.replace(/(en|er|e|n|s)$/,'')));
  });
}
/* Zeitangabe im Text finden, z. B. „30 Minuten“ */
function stepMinutes(step){
  const m = /(\d+)\s*(?:–|-|bis)?\s*(\d+)?\s*(Minuten|Min\.|Min\b|Stunden|Std\b)/i.exec(step);
  if(!m) return 0;
  const v = +(m[2] || m[1]);
  return /std|stunde/i.test(m[3]) ? v*60 : v;
}
function drawCook(){
  const r = cook.r, steps = r.steps || [], total = steps.length + 2;
  const f = cook.servings / yieldOf(r);
  const pct = Math.round(cook.page / (total-1) * 100);
  let body = '', foot = '';

  if(cook.page === 0){                     /* Mise en place */
    const ing = r.ingredients || [];
    body = '<div class="ck-label">Schritt 1 · Herrichten</div>'+
      '<h3>Alles bereitstellen</h3>'+
      '<ul class="ck-check">'+ ing.map((i,k)=>
        '<li class="'+(cook.checked.has(k)?'done':'')+'"><label>'+
          '<input type="checkbox" data-i="'+k+'" '+(cook.checked.has(k)?'checked':'')+'>'+
          '<span class="a">'+esc(amountText(i,f))+'</span>'+
          '<span class="n">'+esc(i.n)+'</span></label></li>').join('') +'</ul>'+
      '<p class="ck-hint" style="text-align:center">'+
        'Mengen für '+num(cook.servings)+' '+esc(yieldLabel(r))+'. '+
        'Abhaken ist freiwillig.</p>';
    foot = '<button class="btn primary" data-go="1">Los geht\'s</button>';
  } else if(cook.page <= steps.length){    /* Arbeitsschritte */
    const k = cook.page - 1, step = steps[k];
    const used = stepIngredients(step, r), mins = stepMinutes(step);
    body = '<div class="ck-label">Schritt '+(k+1)+' von '+steps.length+'</div>'+
      '<p class="ck-step">'+esc(step)+'</p>'+
      (used.length ? '<div class="ck-hint"><span class="l">Dafür brauchst du</span>'+
        used.map(i=>'<span class="i">'+esc(amountText(i,f))+' '+esc(i.n)+'</span>').join('')+
        '</div>' : '')+
      (mins ? '<div style="text-align:center"><button class="ck-timer" data-timer="'+mins+
        '">'+timerLabel(mins)+'</button></div>' : '');
    foot = '<button class="btn" data-go="-1">Zurück</button>'+
           '<button class="btn primary" data-go="1">'+
           (k+1===steps.length ? 'Fertig' : 'Weiter')+'</button>';
  } else {                                  /* Abschluss */
    body = '<div class="ck-done">'+icon(r.chapter,'46px','')+
      '<div class="big">Guten Appetit</div>'+
      '<p class="hint" style="font-size:14px">Willst du das Kochen im Rezept festhalten? '+
      'Der Eintrag erscheint auch auf der gedruckten Notizseite.</p>'+
      '<div style="max-width:340px;margin:22px auto 0;text-align:left">'+
        '<label class="field"><span>Anlass</span>'+
          '<input type="text" id="ckOcc" placeholder="Sonntagessen, Geburtstag …"></label>'+
        '<label class="field"><span>Gäste</span>'+
          '<input type="number" id="ckGuests" min="0" value="'+cook.servings+'"></label>'+
        '<label class="field"><span>Bewertung</span><select id="ckRate">'+
          [5,4,3,2,1].map(v=>'<option value="'+v+'">'+'★'.repeat(v)+'</option>').join('')+
        '</select></label></div></div>';
    foot = '<button class="btn" data-go="-1">Zurück</button>'+
           '<button class="btn primary" id="ckSave">Eintragen und schließen</button>';
  }

  $('#cookRoot').innerHTML =
    '<div class="ck-top"><div class="t">'+esc(r.title)+'</div>'+
      '<button class="x" id="ckX">Beenden</button></div>'+
    '<div class="ck-bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="ck-body"><div class="ck-inner">'+body+'</div></div>'+
    '<div class="ck-foot">'+foot+'</div>';
  bindCook();
}
function timerLabel(mins){ return '⏱ '+mins+' Minuten stellen'; }
function bindCook(){
  const root = $('#cookRoot');
  root.querySelector('#ckX').onclick = () => {
    if(cook.page>0 && cook.page<= (cook.r.steps||[]).length &&
       !confirm('Kochmodus beenden?')) return;
    endCooking();
  };
  root.querySelectorAll('[data-go]').forEach(b=> b.onclick = () => {
    if(cook.timer){ clearInterval(cook.timer.h); cook.timer=null; }
    cook.page = Math.max(0, cook.page + (+b.dataset.go));
    drawCook();
    root.querySelector('.ck-body').scrollTop = 0;
  });
  root.querySelectorAll('[data-i]').forEach(c=> c.onchange = () => {
    const k = +c.dataset.i;
    c.checked ? cook.checked.add(k) : cook.checked.delete(k);
    c.closest('li').classList.toggle('done', c.checked);
  });
  const t = root.querySelector('[data-timer]');
  if(t) t.onclick = () => runTimer(t, +t.dataset.timer);
  const sv = root.querySelector('#ckSave');
  if(sv) sv.onclick = () => {
    const r = cook.r;
    r.log = r.log || [];
    r.log.push({ date:new Date().toLocaleDateString('de-DE'),
      occasion: root.querySelector('#ckOcc').value.trim(),
      guests: +root.querySelector('#ckGuests').value || 0,
      rating: +root.querySelector('#ckRate').value || 0 });
    save(); endCooking(); toast('Ins Rezept eingetragen.');
  };
}
function runTimer(btn, mins){
  if(cook.timer){ clearInterval(cook.timer.h); cook.timer=null;
    btn.classList.remove('run'); btn.textContent = timerLabel(mins); return; }
  let left = mins*60;
  btn.classList.add('run');
  const tick = () => {
    const mm = Math.floor(left/60), ss = left%60;
    btn.textContent = '⏱ '+mm+':'+String(ss).padStart(2,'0')+' — antippen zum Stoppen';
    if(left <= 0){
      clearInterval(cook.timer.h); cook.timer = null;
      btn.classList.remove('run'); btn.textContent = '⏱ Zeit ist um';
      try{ navigator.vibrate && navigator.vibrate([300,120,300]); }catch(e){}
      toast('Timer abgelaufen: '+cook.r.title);
      return;
    }
    left--;
  };
  tick();
  cook.timer = { h: setInterval(tick, 1000) };
}

function openModal(title, html, footBtns, after, narrow){

  return { id:null, chapter:'hauptspeise', title:'', tags:[], prep:'', cookLabel:'Kochen',
           cook:'', difficulty:'Leicht', servings:4, servingsLabel:'Portionen',
           ingredients:[{a:null,u:'g',n:''}], steps:[''],

}
function editRecipe(id, preset){

function readEditor(m){
  const d = draft;
  d.title = m.querySelector('#fTitle').value.trim();
  d.chapter = m.querySelector('#fChapter').value;
  d.tags = m.querySelector('#fTags').value.split(',').map(s=>s.trim())
             .filter(Boolean).slice(0, MAX_TAGS);
  d.prep = m.querySelector('#fPrep').value.trim();
  d.cookLabel = m.querySelector('#fCookLabel').value;
  d.cook = m.querySelector('#fCook').value.trim();
  d.difficulty = m.querySelector('#fDiff').value;
  d.servings = Math.max(1, +m.querySelector('#fServ').value || 4);
  d.servingsLabel = m.querySelector('#fServL').value.trim() || 'Portionen';
  d.tip = m.querySelector('#fTip').value.trim();
  d.ingredients = Array.from(m.querySelectorAll('#ingList .ing-row')).map(row=>{
    const raw = row.querySelector('.ia').value.trim().replace(',', '.')
      .replace('½','.5').replace('¼','.25').replace('¾','.75');
    return { a: raw==='' ? null : parseFloat(raw),
             u: row.querySelector('.iu').value,
             n: row.querySelector('.in').value.trim() };
  }).filter(i=>i.n);
  d.steps = Array.from(m.querySelectorAll('#stepList .st'))
    .map(t=>t.value.trim()).filter(Boolean);

function paintNutri(m){
